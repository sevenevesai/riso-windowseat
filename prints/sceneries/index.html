    /* boats */
    for (const b of v.boats.slice().sort((a, c) => c.dist - a.dist)) {
      own(g, ink, b.hull, { blue: 0.12, pink: 0.04 });
      own(g, ink, b.stripe, { [b.col]: 0.92, indigo: 0.22 });
      own(g, ink, b.below, { indigo: 0.55, blue: 0.4 });
      if (b.mast && (ink === 'indigo' || ink === 'blue')) { g.lineWidth = 0.9; tone(g, 1); g.beginPath(); g.moveTo(...b.mast[0]); g.lineTo(...b.mast[1]); g.stroke(); }
      if (b.lantern) {
        const [x, y] = b.lantern;
        if (ink !== 'yellow' && ink !== 'orange') shade(g, null, { x, y, r0: 0, r: 22, stops: [[0, 1], [0.4, 0.45], [1, 0]], cut: true });
        if (ink === 'yellow') shade(g, null, { x, y, r0: 0, r: 24, stops: [[0, 0.8], [1, 0]] });
        const c = new Path2D(); c.arc(x, y, 1.6, 0, TAU); carve(g, c);
      }
    }

    /* foreground rocks and foam */
    for (const rk of s.rocks) own(g, ink, rk, { indigo: 0.78, blue: 0.55, green: 0.3, orange: 0.12 });
    const rocksAll = new Path2D(); for (const rk of s.rocks) rocksAll.addPath(rk);
    g.save(); g.clip(rocksAll);
    for (const lt of s.rockLit) own(g, ink, lt, { blue: 0.4, pink: 0.2, indigo: 0.1 });
    g.restore();
    carve(g, s.foam);
    if (ink === 'blue') print(g, s.foam, 0.12);
  },
});


/* ── print 2: canyon at sunset ────────────────────────────────────────────────
   Temples and buttes stepping back to the far rim, each carrying the same rock
   column: cream Kaibab cap, buff Coconino cliff, red Hermit and Supai, the tall
   Redwall, then the greenish Tonto platform and the dark schist of the inner
   gorge. The sun is low on the left, so west faces burn and east faces go
   violet; every plane further back is paler and bluer. A juniper on the near
   rim frames it; one raven gives the drop its size.                           */

/* Strata, top down: [name, fraction of height, cliff (1) or slope (0), recipe]. */
const STRATA = [
  ['kaibab', 0.07, 1, { yellow: 0.22, orange: 0.08 }],
  ['toroweap', 0.06, 0, { yellow: 0.2, orange: 0.16, pink: 0.06 }],
  ['coconino', 0.11, 1, { yellow: 0.3, orange: 0.12 }],
  ['hermit', 0.1, 0, { orange: 0.5, pink: 0.22 }],
  ['supai', 0.19, 1, { orange: 0.56, pink: 0.26, yellow: 0.06 }],
  ['redwall', 0.24, 1, { orange: 0.62, pink: 0.38 }],
  ['muav', 0.23, 0, { yellow: 0.2, orange: 0.2, blue: 0.1, pink: 0.06 }],
];

const CANYON = once(() => {
  const r = rngFor('canyon:geo');
  const SUN = [205, 318];
  // Far rim: one long plateau, its cliffs stepping down into haze.
  const rimTop = (x) => 300 + Math.sin(x / 140) * 4 + Math.sin(x / 41) * 1.5 + (x > 760 ? (x - 760) * 0.05 : 0);
  const farRim = below(rimTop, 0);
  const farBands = [];
  { let y = 0; for (const [nm, f] of STRATA) { const y0 = y; y += f * 120; farBands.push({ nm, y0, y1: y }); } }
  // Planes of ridges, back to front. Each is a full-width skyline built from an
  // erosion depth e(x): 0 on an unbroken promontory, 1 down at the Tonto bench.
  // e maps to height through the rock column, where a cliff spends little run
  // on a lot of drop and a slope the reverse, so every profile steps.
  const RUN = STRATA.map(([, f, cliff]) => f * (cliff ? 0.25 : 2.2));
  const runSum = RUN.reduce((a, b) => a + b, 0);
  const stepH = (e) => {
    let acc = 0, h = 0;
    for (let i = 0; i < STRATA.length; i++) {
      const w = RUN[i] / runSum, f = STRATA[i][1];
      if (e <= acc + w) return h + f * (e - acc) / w;
      acc += w; h += f;
    }
    return 1;
  };
  const planeDefs = [
    { top: 318, H: 96, haze: 0.66, n: 5, seed: 1 },
    { top: 334, H: 140, haze: 0.5, n: 4, seed: 2 },
    { top: 356, H: 196, haze: 0.36, n: 4, seed: 3 },
    { top: 384, H: 262, haze: 0.22, n: 3, seed: 4 },
    { top: 420, H: 360, haze: 0.1, n: 3, seed: 5 },
    { top: 548, H: 420, haze: 0.0, n: 2, seed: 7 },
  ];
  const planes = planeDefs.map((d) => {
    const pr = rngFor('canyon:plane:' + d.seed);
    // Promontories: bumps of solid rock; everywhere else erodes toward 1.
    const proms = [];
    for (let i = 0; i < d.n; i++) proms.push({ c: (i + 0.2 + pr() * 0.6) / d.n * (W + 200) - 100, w: 60 + pr() * 170, k: 0.6 + pr() * 0.5 });
    const wob = makeWob(pr, 6);
    const e = (x) => {
      let v = 1;
      for (const p of proms) v = Math.min(v, 1 - p.k * Math.max(0, 1 - Math.pow(Math.abs(x - p.c) / p.w, 2.6)));
      return clamp(v + wob(x / 90) * 0.05, 0, 1);
    };
    const y = (x) => d.top + d.H * stepH(e(x));
    const pts = [[-60, W + 60]];
    for (let x = -60; x <= W + 60; x += 1.5) pts.push([x, y(x)]);
    pts.push([W + 60, W + 60]);
    const path = pathOf(pts);
    // Shadow: flanks falling away to the east (e rising with x) turn from the sun.
    const shadow = new Path2D();
    let run = null;
    for (let x = -60; x <= W + 60; x += 3) {
      const de = e(x + 2) - e(x - 2), inS = de > 0.004;
      if (inS && run === null) run = x;
      if ((!inS || x >= W + 57) && run !== null) {
        // The shaded flank hugs the skyline; lower down the canyon's own shadow takes over.
        const top = [], bot = [];
        for (let xx = run; xx <= x; xx += 2) { top.push([xx, y(xx) - 2]); bot.push([xx, y(xx) + d.H * 0.4]); }
        shadow.addPath(pathOf([...top, ...bot.reverse()]));
        run = null;
      }
    }
    // Contacts between beds are horizontal lines at fixed heights in this plane.
    const contacts = []; { let h = 0; for (const [, f] of STRATA) { h += f; contacts.push(d.top + d.H * h); } }
    // Erosion runnels down the cliffs.
    const marks = new Path2D();
    for (let k = 0; k < d.H * 3; k++) {
      const x = pr() * (W + 40) - 20, yTop = y(x), yy = yTop + pr() * (d.top + d.H - yTop), len = 3 + pr() * d.H * 0.04;
      if (yy > d.top + d.H) continue;
      marks.addPath(nib([[x, yy], [x + (pr() - 0.5) * 1.5, yy + len * 0.5], [x + (pr() - 0.5) * 1.5, yy + len]], wSwell(0.5 + pr() * 0.8, 0.4, 0.5), { per: 4 }));
    }
    return Object.assign({}, d, { e, y, path, shadow, contacts, marks });
  });
  // Foreground outcrop: stacked Kaibab slabs, each a sunlit top, a shaded
  // front and the dark crack under it, rising toward the lower left.
  const slabs = [];
  const edge = (x) => 860 + Math.max(0, x - 120) * 0.2 + Math.max(0, x - 700) * 0.2;
  for (let row = 0, yr = 0; row < 7; row++) {
    const th0 = 18 + r() * 26; yr += th0 * (0.8 + r() * 0.3);
    for (let x = -60 + r() * 60; x < W + 60;) {
      const w = 90 + r() * 260, y0 = edge(x + w / 2) + yr - th0 + (r() - 0.5) * 10, th = th0 * (0.7 + r() * 0.5);
      const tl = 3 + r() * 5, jag = makeWob(r, 5);
      const top = [], bot = [];
      for (let i = 0; i <= 10; i++) { const u = i / 10, xx = x + u * w; top.push([xx, y0 + jag(u * 3) * 2]); bot.push([xx, y0 + th + jag(u * 5 + 2) * 3]); }
      const face = pathOf([...top, ...bot.slice().reverse()]);
      const lit = pathOf([...top, ...top.slice().reverse().map(([xx, yy]) => [xx, yy + tl])]);
      const crack = pathOf([...bot, ...bot.slice().reverse().map(([xx, yy]) => [xx, yy + 2.5])]);
      slabs.push({ face, lit, crack, row });
      x += w + (r() < 0.3 ? 6 + r() * 16 : 0);
    }
  }
  const rimShape = pathOf([[-60, W + 60], ...Array.from({ length: 60 }, (_, i) => { const x = -60 + i * (W + 120) / 59; return [x, edge(x)]; }), [W + 60, W + 60]]);
  // Juniper: a twisted trunk, limbs splitting and turning, flat sprays of foliage.
  const trunk = [], foliage = [], litFol = [];
  const limb = (x, y, ang, len, w, depth) => {
    const pts = [[x, y]];
    let a = ang, xx = x, yy = y;
    const n = 8;
    for (let i = 0; i < n; i++) { a += (r() - 0.5) * 0.5; xx += Math.cos(a) * len / n; yy += Math.sin(a) * len / n; pts.push([xx, yy]); }
    trunk.push(nib(pts, (u) => w * (1 - u * 0.62), { per: 6 }));
    if (depth > 0) {
      const kids = depth > 2 ? 2 : 3;
      for (let k = 0; k < kids; k++) {
        const i = 4 + Math.floor(r() * 4), p = pts[Math.min(i, n)];
        limb(p[0], p[1], a + (k === 0 ? -1 : 1) * (0.35 + r() * 0.6), len * (0.55 + r() * 0.2), w * 0.55, depth - 1);
      }
    } else {
      const cx = xx, cy = yy, rx = 40 + r() * 40, ry = 16 + r() * 12;
      const f = cut(ringPts(cx, cy, rx, ry, 18, (r() - 0.5) * 0.4), r, { amp: ry * 0.5, tear: 0.45 });
      foliage.push(f);
      litFol.push(cut(ringPts(cx - rx * 0.28, cy - ry * 0.35, rx * 0.62, ry * 0.45, 10, 0), r, { amp: ry * 0.2 }));
    }
  };
  limb(930, 1110, -1.75, 240, 30, 4);
  limb(1010, 1100, -2.3, 200, 22, 3);
  // Raven gliding over the drop, fingered primaries spread.
  const rv = [640, 486], S = 1;
  const raven = cut([[rv[0] - 26 * S, rv[1] - 3], [rv[0] - 18, rv[1] - 6], [rv[0] - 12, rv[1] - 4], [rv[0] - 5, rv[1] - 2], [rv[0] - 2, rv[1] - 5],
                     [rv[0] + 3, rv[1] - 4], [rv[0] + 5, rv[1] - 1], [rv[0] + 13, rv[1] - 4], [rv[0] + 20, rv[1] - 7], [rv[0] + 27, rv[1] - 5],
                     [rv[0] + 27, rv[1] - 5], [rv[0] + 21, rv[1] - 3], [rv[0] + 14, rv[1]], [rv[0] + 6, rv[1] + 2], [rv[0] + 3, rv[1] + 7], [rv[0], rv[1] + 8],
                     [rv[0] - 3, rv[1] + 7], [rv[0] - 6, rv[1] + 2], [rv[0] - 14, rv[1] + 1], [rv[0] - 21, rv[1] - 1], [rv[0] - 26, rv[1] - 3]], r, { amp: 0.3, per: 4 });
  return { SUN, rimTop, farRim, farBands, planes, slabs, rimShape, trunk, foliage, litFol, raven };
});

/** Distance haze: contrast falls, the evening air's violet-blue comes up. */
function hazed(spec, h) {
  const o = {};
  for (const k in spec) o[k] = spec[k] * (1 - h);
  o.blue = (o.blue || 0) + 0.2 * h; o.pink = (o.pink || 0) + 0.12 * h; o.violet = (o.violet || 0) + 0.06 * h;
  return o;
}
const SHADOW = { violet: 0.42, blue: 0.2, pink: 0.1 };

/** Paint one plane: bands by stratum, eastern flanks violet, lips shadowed. */
function paintPlane(g, ink, pl) {
  const hz = pl.haze;
  own(g, ink, pl.path, hazed(STRATA[0][3], hz));
  g.save(); g.clip(pl.path);
  let y = pl.top - 30;
  STRATA.forEach(([, , , spec], i) => {
    const y1 = pl.contacts[i] + (i === STRATA.length - 1 ? 200 : 0);
    own(g, ink, pathOf([[-60, y], [W + 60, y], [W + 60, y1], [-60, y1]]), hazed(spec, hz));
    y = y1;
  });
  const sh = hazed(SHADOW, hz * 0.85);
  if (sh[ink]) print(g, pl.shadow, sh[ink]);
  if (ink === 'violet' || ink === 'indigo') {
    STRATA.forEach(([, , cliff], i) => { if (!cliff || i === 0) return;
      const yc = pl.contacts[i - 1], t = Math.max(0.6, 2.2 * (1 - hz));
      print(g, pathOf([[-60, yc], [W + 60, yc], [W + 60, yc + t], [-60, yc + t]]), (ink === 'violet' ? 0.7 : 0.35) * (1 - hz)); });
  }
  if (ink === 'violet' || ink === 'orange') print(g, pl.marks, (ink === 'violet' ? 0.55 : 0.3) * (1 - hz));
  g.restore();
  // The sun is below the far rim for everything deep: the canyon fills with
  // violet shadow from the bottom, and only the upper beds still burn.
  const deep = { violet: 0.55, blue: 0.34, indigo: 0.14, pink: 0.06 }[ink];
  if (deep) shade(g, pl.path, { x0: 0, y0: pl.top + pl.H * 0.3, x1: 0, y1: pl.top + pl.H, stops: [[0, 0], [0.6, deep * 0.4 * (1 - hz * 0.6)], [1, deep * 0.8 * (1 - hz * 0.5)]] });
  if (ink === 'orange' || ink === 'yellow') shade(g, pl.path, { x0: 0, y0: pl.top + pl.H * 0.35, x1: 0, y1: pl.top + pl.H, stops: [[0, 0], [1, 0.7]], cut: true });
}

scene('canyon', {
  inks: ['yellow', 'orange', 'pink', 'violet', 'blue', 'green', 'indigo'],
  plates(g, ink) {
    const c = CANYON(), [sx, sy] = c.SUN;

    /* sky: violet-blue overhead, burning low toward the sun */
    const sky = { blue: [[0, 0.5], [0.45, 0.26], [0.8, 0.06], [1, 0]], violet: [[0, 0.2], [0.5, 0.1], [1, 0]],
                  pink: [[0, 0.04], [0.5, 0.2], [0.85, 0.3], [1, 0.2]], orange: [[0, 0], [0.6, 0.06], [1, 0.3]], yellow: [[0, 0], [0.65, 0.05], [1, 0.3]] }[ink];
    if (sky) shade(g, null, { x0: 0, y0: 0, x1: 0, y1: 330, stops: sky });
    if (ink === 'blue' || ink === 'violet' || ink === 'pink') shade(g, null, { x: sx, y: sy, r0: 0, r: 330, stops: [[0, 1], [0.25, 0.6], [1, 0]], cut: true });
    if (ink === 'yellow') shade(g, null, { x: sx, y: sy, r0: 0, r: 300, stops: [[0, 0.7], [0.3, 0.35], [1, 0]] });
    if (ink === 'orange') shade(g, null, { x: sx, y: sy, r0: 20, r: 260, stops: [[0, 0.25], [1, 0]] });
    const disc = new Path2D(); disc.arc(sx, sy, 19, 0, TAU); carve(g, disc);

    /* far rim: flat, pale, almost the sky's own colour */
    own(g, ink, c.farRim, hazed({ orange: 0.3, pink: 0.2 }, 0.8));
    g.save(); g.clip(c.farRim);
    for (const bd of c.farBands) if (bd.nm === 'coconino' || bd.nm === 'redwall') {
      const y0 = 300 + bd.y0 * 0.6, y1 = 300 + bd.y1 * 0.6;
      own(g, ink, pathOf([[-60, y0], [W + 60, y0], [W + 60, y1], [-60, y1]]), hazed(bd.nm === 'redwall' ? { orange: 0.5, pink: 0.35 } : { yellow: 0.3 }, 0.8));
    }
    g.restore();
    // The sun sets behind the rim: its glow wraps the rim's edge.
    if (ink !== 'yellow' && ink !== 'orange') shade(g, c.farRim, { x: sx, y: sy, r0: 0, r: 160, stops: [[0, 0.8], [1, 0]], cut: true });

    /* temples, back to front, each plane hazier than the one before */
    for (const pl of c.planes) paintPlane(g, ink, pl);



    /* raven */
    own(g, ink, c.raven, { indigo: 0.95, violet: 0.6, orange: 0.3 });

    /* foreground rim and juniper */
    own(g, ink, c.rimShape, { violet: 0.6, indigo: 0.3, orange: 0.3 });
    for (const sl of c.slabs) {
      const far = clamp(1 - sl.row / 6, 0, 1);
      own(g, ink, sl.face, { violet: 0.42, orange: 0.3, pink: 0.12, blue: 0.1 });
      own(g, ink, sl.lit, { orange: 0.34 + far * 0.1, yellow: 0.3, pink: 0.1 });
      own(g, ink, sl.crack, { indigo: 0.9, violet: 0.6, orange: 0.3 });
    }
    for (const t of c.trunk) own(g, ink, t, { indigo: 0.8, orange: 0.5, violet: 0.4 });
    for (const f of c.foliage) own(g, ink, f, { green: 0.9, indigo: 0.72, blue: 0.3 });
    for (let i = 0; i < c.foliage.length; i++) {
      g.save(); g.clip(c.foliage[i]);
      own(g, ink, c.litFol[i], { green: 0.75, indigo: 0.2, orange: 0.3, yellow: 0.25 });
      g.restore();
    }
  },
});

const PRINTS = ['viaduct', 'harbour', 'canyon'];
function drawArt(t) { paintBaked(PRINTS[clamp(Math.floor(t + 1e-6), 0, PRINTS.length - 1)]); }
const SHOTS=[]; // Optional review data: {id,start,end,readAt,action,transition}.
// ART END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=canvas.height=OUT;
paper=bakePaper();
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time');
function render(t) {
  t=clamp(t,0,DUR); ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paper,0,0);drawArt(t);scrub.value=t;clockLabel.value=t.toFixed(2);
}
function paintBaked(id) {
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(bakeScene(id,OUT),0,0);ctx.restore();
}
/* A frame slower than the frame interval cannot play live (live-plate films take
   100-200 ms): Play then renders every frame once into a WebP cache, shown as
   "Buffering n%", and plays from it at FPS; replays are immediate. Fast films play
   live. seek() and window.__riso stay live and pure; tools never touch the cache. */
const FPS=30,NF=Math.round(DUR*FPS),cache=[],bitmaps=new Map(),playBtn=document.getElementById('play');
let at=0,playing=false,epoch=0,recorder=null,recordURL=null,slow=null,buffering=false,filled=0;
function label(){playBtn.textContent=playing?'Pause':buffering?'Buffering '+Math.round(filled/(NF+1)*100)+'%':'Play';}
function start(){if(at>=DUR)at=0;epoch=performance.now()-at*1000;playing=true;label();}
function pause(){if(playing)at=clamp((performance.now()-epoch)/1000,0,DUR);playing=false;buffering=false;label();if(recorder?.state==='recording')recorder.stop();}
async function buffer(){
  buffering=true;label();const resume=at;
  for(let i=0;i<=NF&&buffering;i++){
    if(cache[i])continue;
    render(i/FPS);canvas.toBlob(b=>{cache[i]=b;filled++;},'image/webp',0.8);   // snapshots now, encodes alongside the next draw
    label();await new Promise(r=>setTimeout(r,0));
  }
  while(buffering&&filled<NF+1)await new Promise(r=>setTimeout(r,50));
  if(buffering){buffering=false;at=resume;start();}
}
function play(){
  if(at>=DUR)at=0;
  if(slow===null){const t0=performance.now();render(at);render(at);slow=(performance.now()-t0)/2>900/FPS;}
  if(!slow||filled>=NF+1)start();else buffer();
}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
playBtn.onclick=()=>playing||buffering?pause():play();
document.getElementById('replay').onclick=()=>{seek(0);play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing||buffering?pause():play();if(e.code==='ArrowLeft')seek(at-1/FPS);if(e.code==='ArrowRight')seek(at+1/FPS);});
document.getElementById('record').onclick=()=>{
  if(recorder?.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(FPS),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.getElementById('download');a.href=recordURL;a.download='preview.webm';a.style.display='inline';};
  recorder.start();play();
};
function tick(now){
  if(playing){
    at=clamp((now-epoch)/1000,0,DUR);
    if(!slow)render(at);
    else{
      const i=Math.min(NF,Math.floor(at*FPS));
      for(let j=i;j<Math.min(NF+1,i+8);j++)if(cache[j]&&!bitmaps.has(j)){bitmaps.set(j,null);createImageBitmap(cache[j]).then(b=>bitmaps.set(j,b));}
      for(const [j,b] of bitmaps)if(j<i-1){if(b)b.close();bitmaps.delete(j);}
      const b=bitmaps.get(i);
      if(b){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);scrub.value=at;clockLabel.value=at.toFixed(2);}
    }
    if(at>=DUR)pause();
  }
  requestAnimationFrame(tick);
}
window.__riso={duration:DUR,ready:false,seek,shots:SHOTS};
for(const id of Object.keys(SCENES))bakeScene(id,OUT);
seek(Number(new URLSearchParams(location.search).get('t'))||0);
document.querySelector('nav').hidden=true;
window.__riso.ready=true;
</script></html>
