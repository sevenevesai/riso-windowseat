<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
const CSS=720, W=1080, OUT=2160, K=OUT/W, PITCH=4.6*K, DUR=3;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx * K, ry * K);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.
 * Next to the screen it reads as engraving, and it is how a mid-value stops
 * being flat without adding another ink.

  const cam = Space.camera({ eye, target: [-100, 44, 50], focal: 760 });
  const LIGHT = norm3([0.51, 0.5, 0.63]);                            // low sun behind the viewer's left
  const faceD = (y) => y >= SPRING ? 2.6 : ht(y);
  const rA = (SPAN - 5) / 2;

  // Inner face outline in (s, y): deck run, then every pier leg and arch back.
  const sy = [];
  for (let s = -8; s <= L + 6; s += 1) sy.push([s, DECK]);
  sy.push([L + 6, FOOT]);
  const legY = []; for (let y = FOOT; y <= SPRING; y += 3) legY.push(y); legY.push(SPRING);
  for (let j = NA; j >= 1; j--) {
    const sj = j * SPAN, si = (j - 1) * SPAN, c = (si + sj) / 2;
    for (const y of legY) sy.push([sj - hw(y), y]);
    for (let k = 0; k <= 40; k++) { const ph = k / 40 * Math.PI; sy.push([c + rA * Math.cos(ph), SPRING + rA * Math.sin(ph)]); }
    for (const y of legY.slice().reverse()) sy.push([si + hw(y), y]);
  }
  sy.push([-8, FOOT]);
  const face3 = sy.map(([s, y]) => P(s, y, faceD(y)));
  const face = pathOf(cam.polygon(face3));

  // Arch rings (voussoir bands) and their joints, on the face.
  const rings = [], joints = [];
  for (let j = 1; j <= NA; j++) {
    const c = (j - 0.5) * SPAN, band = [];
    for (let k = 0; k <= 40; k++) { const ph = k / 40 * Math.PI; band.push(P(c + (rA + 1.0) * Math.cos(ph), SPRING + (rA + 1.0) * Math.sin(ph), 2.6)); }
    for (let k = 40; k >= 0; k--) { const ph = k / 40 * Math.PI; band.push(P(c + rA * Math.cos(ph), SPRING + rA * Math.sin(ph), 2.6)); }
    rings.push({ s: c, path: pathOf(cam.polygon(band)) });
    for (let k = 1; k < 26; k++) {
      const ph = k / 26 * Math.PI;
      const a = cam.line(P(c + rA * Math.cos(ph), SPRING + rA * Math.sin(ph), 2.6), P(c + (rA + 1.0) * Math.cos(ph), SPRING + (rA + 1.0) * Math.sin(ph), 2.6));
      if (a.length) joints.push({ s: c, a });
    }
  }

  // Pier sides, the planes facing along the track; only those facing the eye.
  const sides = [];
  for (let j = 0; j <= NA; j++) {
    const sj = j * SPAN;
    for (const sg of [-1, 1]) {
      const n = T(sj).map((v) => v * sg), mid = P(sj + sg * 3, 20, 0);
      if (dot3(n, sub3(eye, mid)) <= 0) continue;
      const q = [P(sj + sg * hw(FOOT), FOOT, ht(FOOT)), P(sj + sg * 2.5, SPRING, 2.6),
                 P(sj + sg * 2.5, SPRING + 1.2, 2.6), P(sj + sg * 2.5, SPRING + 1.2, -2.6),
                 P(sj + sg * 2.5, SPRING, -2.6), P(sj + sg * hw(FOOT), FOOT, -ht(FOOT))];
      sides.push({ s: sj, lam: dot3(n, LIGHT), path: pathOf(cam.polygon(q)) });
    }
  }

  // Deck, parapets, cornice, track. The parapet on the near edge hides the wheels.
  const strip = (y0, d0, y1, d1, s0, s1, st) => {
    const a = [], b = [];
    for (let s = s0; s <= s1 + 1e-6; s += st) { a.push(P(s, y0, d0)); b.push(P(s, y1, d1)); }
    return pathOf(cam.polygon([...a, ...b.reverse()]));
  };
  const S0 = -8, S1 = L + 1;
  const deck = strip(DECK, -2.6, DECK, 2.6, S0, S1, 1);
  const ballast = strip(DECK + 0.15, -1.3, DECK + 0.15, 1.3, S0, S1, 1);
  const farWall = strip(DECK, -2.3, DECK + 1.0, -2.3, S0, S1, 1);
  const farCap = strip(DECK + 1.0, -2.3, DECK + 1.0, -2.65, S0, S1, 1);
  const nearWall = strip(DECK - 0.1, 2.75, DECK + 1.0, 2.75, S0, S1, 1);
  const nearCap = strip(DECK + 1.0, 2.75, DECK + 1.0, 2.3, S0, S1, 1);
  const cornice = strip(DECK - 0.55, 2.9, DECK - 0.1, 2.9, S0, S1, 1);
  const corniceShadow = strip(DECK - 1.0, 2.62, DECK - 0.55, 2.62, S0, S1, 1);
  const rails = [-0.5, 0.5].map((d) => cam.polygon([...Array.from({ length: 60 }, (_, i) => P(S0 + i * (S1 - S0) / 59, DECK + 0.3, d))]).length
    ? Array.from({ length: 120 }, (_, i) => cam.project(P(S0 + i * (S1 - S0) / 119, DECK + 0.3, d))).filter(Boolean) : []);
  const sleepers = [];
  for (let s = S0; s < S1; s += 0.7) {
    const a = cam.line(P(s, DECK + 0.22, -0.95), P(s, DECK + 0.22, 0.95));
    if (a.length) sleepers.push(a);
  }

  // Masonry courses: lines of constant height round the face, clipped to it.
  const courses = [];
  for (let y = FOOT + 0.3; y < DECK - 0.6; y += 0.62) {
    for (let s = S0; s < S1; s += 3) {
      const a = cam.project(P(s, y, faceD(y))), b = cam.project(P(s + 3, y, faceD(y)));
      const c = cam.project(P(s, y + 0.62, faceD(y)));
      if (!a || !b || !c) continue;
      courses.push({ s, y, a, b, gap: Math.abs(c[1] - a[1]) });
    }
  }
  // Header joints staggered course to course, only where a block is large enough to read.
  const perps = [], blocks = [];
  const jr = rngFor('viaduct:joints');
  for (let y = FOOT + 0.3, row = 0; y < DECK - 0.6; y += 0.62, row++) {
    for (let s = S0 + (row % 2) * 0.55; s < 80; s += 0.9 + jr() * 0.5) {
      const a = cam.project(P(s, y, faceD(y))), b = cam.project(P(s, y + 0.62, faceD(y)));
      if (!a || !b || Math.abs(b[1] - a[1]) < 4.2) continue;
      perps.push([a, b]);
      if (jr() < 0.28) {
        const w = 0.7 + jr() * 0.5;
        const q = cam.polygon([P(s, y, faceD(y)), P(s + w, y, faceD(y)), P(s + w, y + 0.62, faceD(y)), P(s, y + 0.62, faceD(y))]);
        blocks.push({ path: pathOf(q), a: jr() });
      }
    }
  }
  // Putlog holes: the rows of square sockets left from the centring and scaffolds.
  const putlogs = [];
  for (let j = 1; j < NA; j++) for (const y of [8, 20, 32, 44]) for (const o of [-1.2, 1.2]) {
    const q = cam.polygon([P(j * SPAN + o - 0.22, y, ht(y) + 0.01), P(j * SPAN + o + 0.22, y, ht(y) + 0.01),
                           P(j * SPAN + o + 0.22, y + 0.4, ht(y) + 0.01), P(j * SPAN + o - 0.22, y + 0.4, ht(y) + 0.01)]);
    if (q.length) putlogs.push(pathOf(q));
  }

  // Lambert along the face: the curve turns the wall from shade into sun toward the far end.
  const lamAt = (s) => dot3(Nin(s), LIGHT);
  const faceStops = [];
  for (let s = S0; s <= S1; s += 6) {
    const p = cam.project(P(s, DECK, 2.6));
    if (p) faceStops.push([p[0], lamAt(s)]);
  }

  // Tunnel portal where the deck meets the cliff.
  const portalPts = (wid, hgt, dd) => {
    const out = [], n = Nin(L), c = P(L, DECK, 0);
    const at = (d, y) => [c[0] + n[0] * d, y, c[2] + n[2] * d];
    out.push(at(-wid, DECK - dd), at(-wid, DECK + hgt - wid));
    for (let k = 0; k <= 24; k++) { const ph = Math.PI - k / 24 * Math.PI; out.push(at(wid * Math.cos(ph), DECK + hgt - wid + wid * Math.sin(ph))); }
    out.push(at(wid, DECK - dd));
    return out;
  };
  const portal = pathOf(cam.polygon(portalPts(2.7, 6.6, 0)));
  const portalRing = pathOf(cam.polygon(portalPts(3.7, 7.6, 1.4)));
  const portalXY = cam.project(P(L, DECK + 3, 0));

  // Train: a tank engine and three coaches running up the curve toward the portal.
  const boxes = [];
  const box = (sa, sb, y0, y1, w, part, dz) => {
    const A = P(sa, 0, dz || 0), B = P(sb, 0, dz || 0), u = norm3(sub3(B, A)), n = norm3(cross3([0, 1, 0], u));
    const nn = dot3(n, Nin((sa + sb) / 2)) > 0 ? n : n.map((v) => -v);
    const c = (p, sd, y) => [p[0] + nn[0] * sd * w / 2, y, p[2] + nn[2] * sd * w / 2];
    const V = { a0: c(A, -1, y0), a1: c(A, 1, y0), b0: c(B, -1, y0), b1: c(B, 1, y0),
                A0: c(A, -1, y1), A1: c(A, 1, y1), B0: c(B, -1, y1), B1: c(B, 1, y1) };
    const faces = [
      { n: nn, q: [V.a1, V.b1, V.B1, V.A1], f: 'side' },
      { n: nn.map((v) => -v), q: [V.a0, V.b0, V.B0, V.A0], f: 'side' },
      { n: [0, 1, 0], q: [V.A0, V.B0, V.B1, V.A1], f: 'top' },
      { n: u.map((v) => -v), q: [V.a0, V.a1, V.A1, V.A0], f: 'end' },
      { n: u, q: [V.b0, V.b1, V.B1, V.B0], f: 'end' },
    ];
    const ctr = P((sa + sb) / 2, (y0 + y1) / 2, dz || 0);
    for (const f of faces) {
      if (dot3(f.n, sub3(eye, ctr)) <= 0) continue;
      f.path = pathOf(cam.polygon(f.q)); f.lam = dot3(f.n, LIGHT); f.part = part;
      f.depth = cam.depth(ctr); f.q3 = f.q; boxes.push(f);
    }
    return { A, B, u, n: nn };
  };
  const FRONT = 131, LOCO = 10.5, CAR = 14, GAPC = 0.9, RB = DECK + 0.7;
  const cars = [];
  for (let k = 0; k < 3; k++) {
    const b = FRONT - LOCO - GAPC - k * (CAR + GAPC), a = b - CAR;
    cars.push({ a, b });
    box(a, b, RB + 0.3, RB + 3.1, 2.65, 'car');
    box(a + 0.3, b - 0.3, RB + 3.1, RB + 3.45, 2.3, 'roof');
    box(a - 0.02, b + 0.02, RB + 0.3, RB + 0.9, 2.7, 'skirt');
  }
  // Coach windows on the side facing the viewer.
  const windows = [];
  for (const { a, b } of cars) {
    for (let s = a + 1.3; s < b - 1.4; s += 1.55) {
      const q = cam.polygon([P(s, RB + 1.75, 1.34), P(s + 1.0, RB + 1.75, 1.34), P(s + 1.0, RB + 2.7, 1.34), P(s, RB + 2.7, 1.34)]);
      if (q.length) windows.push(pathOf(q));
    }
  }
  const lb = FRONT - LOCO;
  box(lb, FRONT, RB + 0.2, RB + 0.8, 2.7, 'frame');
  box(lb, lb + 2.6, RB + 0.8, RB + 3.6, 2.6, 'cab');
  box(lb - 0.15, lb + 2.75, RB + 3.6, RB + 3.85, 2.8, 'cabroof');
  box(lb + 2.6, FRONT - 0.4, RB + 0.8, RB + 1.9, 2.5, 'tank');
  // Boiler: an octagonal prism, so its roundness is carried by facets turning to the light.
  const bc = RB + 2.3, br = 0.85;
  {
    const A = P(lb + 2.6, 0, 0), B = P(FRONT - 0.5, 0, 0), u = norm3(sub3(B, A)), n = norm3(cross3([0, 1, 0], u));
    const nn = dot3(n, Nin(FRONT)) > 0 ? n : n.map((v) => -v);
    const ring = (p, ph) => [p[0] + nn[0] * Math.cos(ph) * br, bc + Math.sin(ph) * br, p[2] + nn[2] * Math.cos(ph) * br];
    const ctr = P((lb + FRONT) / 2, bc, 0);
    for (let k = 0; k < 8; k++) {
      const p0 = k / 8 * TAU + TAU / 16, p1 = p0 + TAU / 8, pm = (p0 + p1) / 2;
      const nf = [nn[0] * Math.cos(pm), Math.sin(pm), nn[2] * Math.cos(pm)];
      if (dot3(nf, sub3(eye, ring(A, pm))) <= 0) continue;
      boxes.push({ n: nf, lam: dot3(nf, LIGHT), part: 'boiler', depth: cam.depth(ctr) - 0.01,
                   path: pathOf(cam.polygon([ring(A, p0), ring(B, p0), ring(B, p1), ring(A, p1)])) });
    }
  }
  box(FRONT - 2.2, FRONT - 1.6, bc + br - 0.1, bc + br + 0.95, 0.55, 'chimney');
  box(FRONT - 5.4, FRONT - 4.6, bc + br - 0.1, bc + br + 0.45, 0.8, 'dome');
  const chimneyTop = P(FRONT - 1.9, bc + br + 0.95, 0);
  boxes.sort((a, b) => b.depth - a.depth);

  // Steam: puffs trail back along the track as the engine runs, swelling and thinning.
  const puffs = [];
  const pr = rngFor('viaduct:steam');
  for (let i = 0; i < 24; i++) {
    const s = FRONT - 1.9 - Math.max(0, i - 1.5) * 1.45 - pr() * 0.9;
    const y = chimneyTop[1] + 0.3 + Math.min(i, 3) * 0.8 + Math.max(0, i - 3) * 0.3 + (pr() - 0.5) * 1.1;
    const d = 0.3 + i * 0.1 + (pr() - 0.5) * 1.4;
    const r = 0.5 + i * 0.2 + pr() * 0.5;
    const c = P(s, y, d), p = cam.project(c);
    if (!p) continue;
    const rr = r * cam.focal / cam.depth(c);
    puffs.push({ i, x: p[0], y: p[1], r: rr,
                 path: cut(ringPts(p[0], p[1], rr * (1.05 + pr() * 0.2), rr * (0.82 + pr() * 0.15), 11, (pr() - 0.5) * 0.6), pr, { amp: rr * 0.14 }) });
  }

  // Where world height 24 m lands on screen: the top of the near fog bank.
  const fogPts = [];
  for (let s = S0; s <= L; s += 4) { const p = cam.project(P(s, 24, 4)); if (p) fogPts.push(p); }
  fogPts.sort((a, b) => a[0] - b[0]);
  const fogY = (x) => {
    if (x <= fogPts[0][0]) return fogPts[0][1];
    for (let i = 1; i < fogPts.length; i++) if (x <= fogPts[i][0]) {
      const a = fogPts[i - 1], b = fogPts[i]; return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0]));
    }
    return fogPts[fogPts.length - 1][1];
  };
  const horizon = cam.project([eye[0] - 3000, eye[1], eye[2] + 300])[1];

  return { cam, P, face, rings, joints, sides, deck, ballast, farWall, farCap, nearWall, nearCap, cornice,
           corniceShadow, rails, sleepers, courses, perps, blocks, putlogs, faceStops, portal, portalRing,
           portalXY, boxes, windows, puffs, fogY, horizon, lamAt };
});

/* Scenery around the viaduct, in screen space keyed to the camera. */

/**
 * Rows of spruce under a skyline, back to front. Each row is one path, so a
 * row can own its value and the gaps between crowns stay the darker body of
 * the forest. `lit` holds the sun-side flank of every crown in the row.
 *   o.gap spacing   o.h height   o.step row pitch   o.scale(k) growth per row
 */
function forestRows(topFn, x0, x1, rows, o, r) {
  const out = [];
  for (let k = 0; k < rows; k++) {
    const trees = new Path2D(), lit = new Path2D(), sc = o.scale ? o.scale(k) : 1;
    for (let x = x0 + r() * o.gap; x < x1; x += o.gap * sc * (0.55 + r() * 0.8)) {
      const h = o.h * sc * (0.65 + r() * 0.7), w = h * (o.wr || 0.34);
      const y = topFn(x) + k * o.step * sc + h * 0.8 + (r() - 0.5) * o.step * 0.7;
      trees.addPath(spruce(x, y, h, w, r));
      lit.addPath(pathOf([[x, y - h], [x - w * 0.5, y - h * 0.08], [x - w * 0.18, y - h * 0.1], [x + w * 0.02, y - h * 0.55]]));
    }
    out.push({ trees, lit, k });
  }
  return out;
}
/** Paint forest rows: each row clears and prints its own tone, then its lit flanks. */
function paintRows(g, ink, rows, recipe, litRecipe) {
  for (const row of rows) {
    const spec = recipe(row.k);
    own(g, ink, row.trees, spec);
    g.save(); g.clip(row.trees);
    const ls = litRecipe(row.k);
    carve(g, row.lit);
    if (ls[ink]) print(g, row.lit, ls[ink]);
    g.restore();
  }
}

const VIA_LAND = once(() => {
  const v = VIA(), r = rngFor('viaduct:land');
  const [px, py] = v.portalXY;
  const hz = v.horizon;

  // Far range: summits with subsidiary tops; snow runs down in fingers along couloirs.
  const peaks = [{ x: 40, y: 64, w: 300 }, { x: 330, y: 150, w: 150 }, { x: 470, y: 84, w: 320 },
                 { x: 760, y: 128, w: 260 }];
  const jag = makeWob(r, 8), fing = makeWob(r, 9);

  const range = (x) => {
    let top = base;
    for (const p of peaks) {
      const d = (x - p.x) / p.w, ad = Math.abs(d);
      if (ad < 1) top = Math.min(top, p.y + (base - p.y) * Math.pow(ad, 0.85) * (d > 0 ? 1.08 : 0.94));

    const f = Math.pow(Math.abs(fing(x / W * 60)), 3) * 70 + Math.pow(Math.abs(fing(x / W * 170 + 5)), 4) * 40;

  for (let x = W + 60; x >= -60; x -= 1.5) snowPts.push([x, Math.min(range(x) + snowDepth(x), base + 20)]);
  const snow = pathOf(snowPts);
  // The east side of every summit, turned away from the low sun.
  const eastFaces = peaks.map((p) => pathOf([[p.x - 1, p.y - 3], [p.x + p.w * 0.9, base + 30], [p.x + p.w * 0.12, base + 30], [p.x + p.w * 0.02, p.y + 50]]));
  const ribs = [];
  for (const p of peaks) for (let k = 0; k < 9; k++) {
    const x0 = p.x + (r() - 0.6) * p.w * 0.9, y0 = range(x0) + 3;
    const pts = [[x0, y0]];
    let x = x0, y = y0;
    for (let i = 0; i < 8; i++) { y += 6 + r() * 8; x += (x0 > p.x ? 1 : -1) * (1 + r() * 3.5); pts.push([x, y]); }

  const midTop = (x) => midF(ridgeU(x));
  const midRows = forestRows(midTop, -40, W + 40, 3, { gap: 6, h: 9, step: 6 }, r);

  // Far wall of the gorge, the backdrop the arches open onto.

  const wall = below(wallTop, 0);
  const wallRows = forestRows(wallTop, -40, W + 40, 22, { gap: 8, h: 15, step: 13, scale: (k) => 1 + k * 0.03 }, r);

  // Cliff around the portal: limestone buttresses, forest on the crown.
  const cl = [[px - 64, -20], [px - 80, 40], [px - 62, 96], [px - 86, 150], [px - 56, 214], [px - 62, py - 70],
              [px - 36, py - 30], [px - 22, py - 4], [px - 16, py + 30], [px - 32, py + 120], [px - 14, py + 220],
              [px - 26, py + 330], [px + 4, W + 60], [W + 60, W + 60], [W + 60, -20]];
  const crownY = (x) => 96 + (x - px) * 0.12 + Math.sin(x / 23) * 6 + (x < px - 30 ? (px - 30 - x) * 1.6 : 0);
  // The rock begins under the crown's trees; above them is sky.
  const cliff = cut(cl, r, { amp: 3, per: 6 });
  const rockTop = pathOf([...Array.from({ length: 120 }, (_, i) => { const x = px - 140 + i * (W + 200 - px) / 119; return [x, crownY(x) + 22]; }),
                          [W + 60, W + 60], [px - 140, W + 60]]);
  // Crown: two ranks of distinct spruce standing on the cliff edge against the sky.

  for (let x = px - 70; x < W + 40; x += 12 + r() * 12) {

  const crownBody = pathOf([...Array.from({ length: 90 }, (_, i) => { const x = px - 80 + i * (W + 140 - px) / 89; return [x, crownY(x) + 20 + Math.sin(i * 1.7) * 4]; }),
                            [W + 60, crownY(W + 60) + 44], ...Array.from({ length: 90 }, (_, i) => { const x = W + 60 - i * (W + 140 - px) / 89; return [x, crownY(x) + 44 + Math.sin(i * 2.3) * 5]; })]);
  // Buttresses: each column of limestone has a sunlit west plane and a shaded east

  let bx = px - 70;
  while (bx < W + 30) {
    const w = 34 + r() * 50, top = crownY(bx + w / 2) + 14 + r() * 26, bot = W + 40;
    const wob = makeWob(r, 4), wob2 = makeWob(r, 5);
    const left = [], right = [], ar = [];
    for (let y = top; y <= bot; y += 14) {
      const u = (y - top) / (bot - top);
      left.push([bx + wob(u * 9) * 5, y]);
      right.push([bx + w + wob2(u * 9) * 5, y]);
      ar.push([bx + w * (0.52 + wob(u * 6 + 2) * 0.14), y]);
    }
    const lid = [[bx + w * 0.1, top - 6], [bx + w * 0.5, top - 12 - r() * 8], [bx + w * 0.9, top - 4]];
    const whole = pathOf([...left.slice().reverse(), ...lid, ...right]);
    const east = pathOf([...ar.slice().reverse(), lid[1], lid[2], ...right]);
    buttresses.push({ x: bx, w, whole, east, ar });
    const crack = right.map(([x, y]) => [x + 1, y]);
    for (let i0 = 0; i0 < crack.length - 3;) {
      const n = 3 + Math.floor(r() * 6), seg = crack.slice(i0, i0 + n);
      if (seg.length > 2 && r() < 0.8) fissures.push(nib(seg, wSwell(1.2 + r() * 2.2, 0.5, 0.45), { per: 5 }));
      i0 += n + Math.floor(r() * 3);
    }
    bx += w * (0.82 + r() * 0.2);
  }
  // Overhangs: a lip catching sun over the wedge of shadow it throws down the face.
  const beds = [];
  for (let k = 0; k < 18; k++) {
    const x0 = px - 30 + r() * 300, y0 = 170 + r() * 380, len = 16 + r() * 34;
    beds.push({ dark: pathOf([[x0, y0], [x0 + len, y0 + 2], [x0 + len * 0.8, y0 + 9 + r() * 8], [x0 + len * 0.2, y0 + 6]]),
                lit: nib([[x0 - 2, y0 - 1], [x0 + len * 0.5, y0 - 2], [x0 + len + 2, y0 + 1]], wSwell(1.4, 0.45, 0.5), { per: 5 }) });
  }
  const ledges = [];
  for (let k = 0; k < 26; k++) {
    const x = px - 30 + r() * 300, y = 170 + r() * 420;
    ledges.push(spruce(x, y, 7 + r() * 15, 3 + r() * 5, r));
  }
  const ledgeTrees = new Path2D(); for (const t of ledges) ledgeTrees.addPath(t);

  // Gorge floor: canopy rising out of the fog below the arches.
  const floorTop = (x) => 690 + Math.max(0, 420 - x) * 0.22 + Math.sin(x / 80) * 12 + Math.sin(x / 29) * 4;
  const floorRows = forestRows(floorTop, -40, W + 40, 10, { gap: 12, h: 26, step: 17, scale: (k) => 1 + k * 0.08 }, r);
  // Near slope under the viewer: one rank of large spruce whose tips break a lower fog layer.
  const lowFog = (x) => 872 + Math.sin(x / 110 + 2) * 16 + Math.sin(x / 37) * 5;
  const near = [], nearLit = new Path2D(), nearAll = new Path2D();
  // Clumped, not spaced: groups of two to four with open fog between them.
  const stand = [];
  for (let x = 250 + r() * 30; x < W + 60;) {
    const n = 2 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      const tip = 790 + r() * 190 + (i === 0 ? -30 : 0), y = W + 60 + r() * 40;
      stand.push({ x: x + i * (16 + r() * 22), y, h: y - tip });
    }
    x += n * 24 + 50 + r() * 90;
  }
  stand.sort((a, b) => a.h - b.h);            // the short, farther stems first
  for (const t0 of stand) {
    const w = t0.h * (0.26 + r() * 0.08);
    const t = spruce(t0.x, t0.y, t0.h, w, r);
    near.push(t); nearAll.addPath(t);
    nearLit.addPath(spruceLit(t0.x, t0.y, t0.h, w, Math.round(t0.h / 9), 2.0));
  }

  // Foreground: a stand of spruce cropped by the lower left corner.
  const fore = [];
  for (const [x, y, h, w] of [[-70, 1110, 330, 120], [150, 1170, 420, 118], [-10, 1150, 600, 160], [80, 1140, 500, 136]]) {
    fore.push({ x, y, h, w, path: spruce(x, y, h, w, r) });
  }
  const foreLit = new Path2D();
  for (const f of fore) foreLit.addPath(spruceLit(f.x, f.y, f.h, f.w, 18, 2.4));

  const fogBack = (x) => wallTop(x) + 250 + x * 0.02 + Math.sin(x / 90) * 10 + Math.sin(x / 31 + 2) * 4;
  const fogFront = (x) => v.fogY(x) + Math.sin(x / 70 + 1) * 12 + Math.sin(x / 23) * 4;
  return { range, rangePath, snow, eastFaces, ribs, mid, midRows, wall, wallTop, wallRows, cliff, rockTop, crownBack, crownFront, crownLit,
           crownBody, buttresses, fissures, beds, ledgeTrees, floorTop, floorRows, lowFog, near, nearLit, nearAll, fore, foreLit, fogBack, fogFront, px, py, hz };
});

const STONE_LIT = { yellow: 0.15, orange: 0.1, blue: 0.07 };
const STONE_SHADE = { blue: 0.36, orange: 0.17, indigo: 0.1, yellow: 0.03 };
const stoneAt = (lam) => mixInk(STONE_SHADE, STONE_LIT, (lam + 0.45) / 1.0);

scene('viaduct', {
  inks: ['yellow', 'orange', 'blue', 'green', 'indigo'],
  plates(g, ink) {
    const v = VIA(), l = VIA_LAND(), hz = v.horizon;
    const rr = rngFor('viaduct:' + ink + ':marks');

    /* sky: cool at the zenith, opening to warm paper over the range */
    if (ink === 'blue') shade(g, null, { x0: 0, y0: 0, x1: 0, y1: hz + 30, stops: [[0, 0.42], [0.6, 0.16], [1, 0.03]] });
    if (ink === 'yellow') shade(g, null, { x0: 0, y0: 40, x1: 0, y1: hz + 30, stops: [[0, 0], [0.7, 0.08], [1, 0.14]] });

    /* far range: rock in haze, lit snow bare paper, shaded snow blue */
    own(g, ink, l.rangePath, { blue: 0.3, indigo: 0.05, orange: 0.03 });
    g.save(); g.clip(l.rangePath);
    for (const f of l.eastFaces) if (ink === 'blue') print(g, f, 0.14);
    carve(g, l.snow);
    g.save(); g.clip(l.snow);
    for (const f of l.eastFaces) if (ink === 'blue') print(g, f, 0.2);
    if (ink === 'blue') for (const rb of l.ribs) print(g, rb, 0.35);
    g.restore();
    g.restore();
    shade(g, l.rangePath, { x0: 0, y0: hz - 10, x1: 0, y1: hz + 40, stops: [[0, 0], [1, 0.85]], cut: true });

    /* middle ridge */
    own(g, ink, l.mid, { blue: 0.24, green: 0.14, indigo: 0.02 });
    paintRows(g, ink, l.midRows, () => ({ blue: 0.28, green: 0.2, indigo: 0.03 }), () => ({ blue: 0.18, green: 0.12, yellow: 0.05 }));
    shade(g, l.mid, { x0: 0, y0: hz + 30, x1: 0, y1: hz + 80, stops: [[0, 0], [1, 0.9]], cut: true });

    /* far gorge wall: dark forest, hazier near its skyline than in the shade below */
    own(g, ink, l.wall, { green: 0.55, blue: 0.4, indigo: 0.34 });
    paintRows(g, ink, l.wallRows,
      (k) => ({ green: 0.4 + k * 0.012, blue: 0.3, indigo: 0.1 + k * 0.01 }),
      (k) => ({ green: 0.34, blue: 0.14, yellow: 0.3 - k * 0.008 }));
    shade(g, l.wall, { x0: 0, y0: hz + 50, x1: 0, y1: hz + 170, stops: [[0, 0.55], [1, 0]], cut: true });

    /* cliff: pale limestone buttresses, each modelled from lit west edge to shaded east */
    g.save(); g.clip(l.cliff);
    g.save(); g.clip(l.rockTop);
    own(g, ink, l.cliff, { yellow: 0.14, orange: 0.1, blue: 0.2, indigo: 0.05 });
    for (const b of l.buttresses) {
      own(g, ink, b.whole, { yellow: 0.13, orange: 0.07, blue: 0.04 });
      own(g, ink, b.east, { blue: 0.36, orange: 0.12, indigo: 0.08, yellow: 0.04 });
    }
    for (const b of l.beds) { own(g, ink, b.dark, { blue: 0.55, indigo: 0.2, orange: 0.1 }); carve(g, b.lit); }
    if (ink === 'indigo' || ink === 'blue') for (const fs of l.fissures) print(g, fs, 1);
    if (ink === 'blue' || ink === 'indigo')
      shade(g, null, { x0: 0, y0: l.py - 40, x1: 0, y1: l.py + 260, stops: [[0, 0], [1, ink === 'blue' ? 0.42 : 0.14]] });
    own(g, ink, l.ledgeTrees, { green: 0.75, indigo: 0.45, blue: 0.2 });
    g.restore();
    g.restore();
    own(g, ink, l.crownBack, { green: 0.5, blue: 0.34, indigo: 0.14 });
    own(g, ink, l.crownBody, { green: 0.8, blue: 0.35, indigo: 0.55 });
    own(g, ink, l.crownFront, { green: 0.82, blue: 0.24, indigo: 0.46 });
    g.save(); g.clip(l.crownFront);
    if (ink === 'indigo' || ink === 'blue') carve(g, l.crownLit);
    if (ink === 'yellow') print(g, l.crownLit, 0.5);
    if (ink === 'indigo') print(g, l.crownLit, 0.12);
    g.restore();
    own(g, ink, v.portalRing, { yellow: 0.12, orange: 0.14, blue: 0.22 });
    own(g, ink, v.portal, { indigo: 0.92, orange: 0.5, green: 0.35 });

    /* back fog bank */
    fogCut(g, l.fogBack, 12, 9, 0.24);

    /* viaduct */
    carve(g, v.face);
    for (const sd of v.sides) own(g, ink, sd.path, stoneAt(sd.lam - 0.25));
    const minX = v.faceStops[0][0], maxX = v.faceStops[v.faceStops.length - 1][0];
    const stops = v.faceStops.map(([x, lam]) => [(x - minX) / (maxX - minX), stoneAt(lam)[ink] || 0]);
    shade(g, v.face, { x0: minX, y0: 0, x1: maxX, y1: 0, stops });
    g.save(); g.clip(v.face);
    if (ink === 'orange' || ink === 'blue') for (const b of v.blocks) print(g, b.path, 0.04 + b.a * 0.1);
    if (ink === 'blue') {
      // Course lines print solid and fade by width: a screened hairline breaks into dashes.
      g.lineCap = 'butt'; tone(g, 1);
      for (const c of v.courses) {
        if (c.gap < 2.2) continue;
        g.lineWidth = clamp(c.gap * 0.07, 0.3, 0.9);
        g.beginPath(); g.moveTo(c.a[0], c.a[1]); g.lineTo(c.b[0], c.b[1]); g.stroke();
      }
      g.lineWidth = 0.35;
      for (const [a, b] of v.perps) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    }
    for (const rg of v.rings) {
      const lam = v.lamAt(rg.s);
      own(g, ink, rg.path, stoneAt(lam + 0.3));
    }
    if (ink === 'blue') {
      g.lineWidth = 0.4; tone(g, 1);
      for (const j of v.joints) { g.beginPath(); g.moveTo(j.a[0][0], j.a[0][1]); g.lineTo(j.a[1][0], j.a[1][1]); g.stroke(); }
    }
    if (ink === 'indigo' || ink === 'orange') for (const p of v.putlogs) print(g, p, ink === 'indigo' ? 0.8 : 0.4);
    g.restore();
    own(g, ink, v.corniceShadow, { blue: 0.45, indigo: 0.25, orange: 0.12 });
    own(g, ink, v.deck, { blue: 0.18, orange: 0.1, yellow: 0.12 });
    own(g, ink, v.ballast, { blue: 0.3, orange: 0.2, indigo: 0.12 });
    if (ink === 'indigo') {
      g.lineWidth = 0.5; tone(g, 1);
      for (const [a, b] of v.sleepers) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    }
    if (ink === 'indigo' || ink === 'blue') {
      g.lineWidth = 0.8; tone(g, 1);
      for (const rl of v.rails) { if (rl.length) { g.beginPath(); rl.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); } }
    }
    own(g, ink, v.farWall, stoneAt(0.35));
    own(g, ink, v.farCap, { yellow: 0.1, orange: 0.05 });

    /* train */
    const TRAIN = {
      car: (lam) => mixInk({ orange: 0.95, indigo: 0.3, blue: 0.1 }, { orange: 0.9, yellow: 0.25 }, (lam + 0.3) / 1.0),
      skirt: () => ({ orange: 0.7, indigo: 0.7 }),
      roof: (lam) => mixInk({ blue: 0.45, indigo: 0.3 }, { blue: 0.24, indigo: 0.08, yellow: 0.06 }, lam),
      frame: () => ({ indigo: 0.9, orange: 0.55 }),
      cab: (lam) => mixInk({ green: 0.95, indigo: 0.6 }, { green: 0.9, indigo: 0.25, yellow: 0.1 }, (lam + 0.3) / 1.0),
      cabroof: () => ({ indigo: 0.85, green: 0.5 }),
      tank: (lam) => mixInk({ green: 0.95, indigo: 0.6 }, { green: 0.88, indigo: 0.2, yellow: 0.12 }, (lam + 0.3) / 1.0),
      boiler: (lam) => mixInk({ green: 0.95, indigo: 0.7 }, { green: 0.8, indigo: 0.1, yellow: 0.22 }, (lam + 0.2) / 1.1),
      chimney: () => ({ indigo: 0.9, green: 0.4, orange: 0.3 }),
      dome: () => ({ yellow: 0.75, orange: 0.35 }),
    };
    for (const f of v.boxes) own(g, ink, f.path, TRAIN[f.part](f.lam));
    for (const w of v.windows) own(g, ink, w, { blue: 0.45, indigo: 0.35, yellow: 0.05 });
    own(g, ink, v.nearCap, { yellow: 0.12, orange: 0.06 });
    own(g, ink, v.nearWall, stoneAt(0.1));
    own(g, ink, v.cornice, { yellow: 0.12, orange: 0.06, blue: 0.04 });

    /* steam: bare paper, cool on the side away from the sun, thinning as it ages */
    // Oldest puff first, each newer one owning its lobe, so the plume billows
    // rather than merging into one beam.
    for (const p of v.puffs.slice().reverse()) {
      const fade = clamp(1 - (p.i - 9) / 15, 0, 1);
      g.save(); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = p.i < 9 ? 1 : 0.15 + fade * 0.85; g.fill(p.path); g.restore();
      if (ink === 'blue' || ink === 'indigo') {
        const a = (ink === 'blue' ? 0.4 : 0.1) * (0.25 + fade * 0.75);
        shade(g, p.path, { x: p.x + p.r * 0.55, y: p.y + p.r * 0.75, r0: 0, r: p.r * 1.15, stops: [[0, a], [0.55, a * 0.5], [1, 0]] });
      }
    }

    /* near fog dissolves the piers' feet; the gorge floor rises out of it */
    fogCut(g, l.fogFront, 12, 9, 0.24);
    const floor = below(l.floorTop, 30);
    carve(g, floor);
    const fb = { green: 0.85, blue: 0.4, indigo: 0.6 }[ink];
    if (fb) shade(g, floor, { x0: 0, y0: l.floorTop(540) + 20, x1: 0, y1: W, stops: [[0, 0.05 * fb], [0.35, 0.45 * fb], [1, fb]] });
    paintRows(g, ink, l.floorRows,
      (k) => { const f = clamp(k / 14, 0, 1); return { green: 0.14 + f * 0.62, blue: 0.1 + f * 0.24, indigo: f * f * 0.36 }; },
      (k) => { const f = clamp(k / 14, 0, 1); return { green: 0.08 + f * 0.42, yellow: 0.12 + f * 0.34, blue: 0.03 }; });
    fogCut(g, l.lowFog, 8, 9, 0.3);
    for (const t of l.near) own(g, ink, t, { green: 0.78, blue: 0.3, indigo: 0.4 });
    g.save(); g.clip(l.nearAll);
    if (ink === 'indigo' || ink === 'blue') carve(g, l.nearLit);
    if (ink === 'yellow') print(g, l.nearLit, 0.42);
    if (ink === 'green') print(g, l.nearLit, 0.5);
    g.restore();
    // Their feet stand in the same low fog their tips rose out of.
    shade(g, l.nearAll, { x0: 0, y0: 900, x1: 0, y1: W, stops: [[0, 0], [1, 0.35]], cut: true });
    if (ink === 'blue') {
      for (let k = 0; k < 6; k++) {
        const y = l.fogFront(540) + 30 + k * 40 + rr() * 30, x = rr() * W;
        shade(g, null, { x, y, r0: 0, r: 240, stops: [[0, 0.05], [1, 0]] });
      }
    }

    /* foreground spruce: the nearest plane, darkest, cropped */
    for (const f of l.fore) own(g, ink, f.path, { green: 0.9, indigo: 0.66, blue: 0.24 });
    const foreAll = new Path2D(); for (const f of l.fore) foreAll.addPath(f.path);
    g.save(); g.clip(foreAll);
    if (ink === 'indigo' || ink === 'blue') carve(g, l.foreLit);
    if (ink === 'yellow') print(g, l.foreLit, 0.5);
    if (ink === 'indigo') print(g, l.foreLit, 0.2);
    g.restore();
  },
});


/* ── print 1: harbour village, blue hour ──────────────────────────────────────
   Tower houses stacked up a sea cliff, seen from the water just after sunset.
   Houses are world boxes on one hillside surface; the sea reflects them by
   projecting the same geometry mirrored through y = 0, so every reflection
   agrees with its house. Lit windows and lamps are paper knocked out of the
   dusk and carried down the water as broken streaks.                         */

const HARB = once(() => {
  const r = rngFor('harbour:geo');
  const eye = [5, 7, -190];
  const cam = Space.camera({ eye, target: [-14, 40, 30], focal: 1680 });
  const H = (x, z) => Math.max(-3, 6.5 + z * 0.7 + Math.max(0, x) * 0.2 - Math.max(0, -x - 50) * 1.6);
  const proj = (p) => cam.project(p);
  const mir = (p) => [p[0], -p[1], p[2]];
  const poly = (q) => { const c = cam.polygon(q); return c.length > 2 ? pathOf(c) : null; };
  const horizon = cam.project([0, 0, 1e5])[1];

  const WALLS = [
    { pink: 0.42, yellow: 0.08 }, { yellow: 0.5, orange: 0.12 }, { orange: 0.46, yellow: 0.1 },
    { pink: 0.3, yellow: 0.28 }, { orange: 0.62, pink: 0.34 }, { yellow: 0.26, orange: 0.04 },
    { pink: 0.2, blue: 0.08 }, { yellow: 0.42, pink: 0.14 }, { orange: 0.3, pink: 0.18, yellow: 0.12 },
  ];

  // Houses: rows stepping up the slope, narrower toward the top of the spur.
  const houses = [];
  for (let row = 0; row < 7; row++) {
    const z = 3 + row * 10.5;
    let x = -52 + row * 3 + r() * 3;
    const xEnd = 95 - row * 4;
    while (x < xEnd) {
      const w = 6.5 + r() * 4, d = 7 + r() * 3, zz = z + r() * 2.5;
      if (r() < 0.1 && row > 0) { x += w * 0.6; continue; }       // a garden or a stair gap
      const base = Math.min(H(x, zz), H(x + w, zz)) - 0.5;
      const hgt = 10 + r() * 9 + (row === 0 ? 2 : 0);
      houses.push({ x0: x, x1: x + w, z0: zz, z1: zz + d, base, top: base + hgt, wall: WALLS[Math.floor(r() * WALLS.length)], seed: r() });
      x += w + (r() < 0.3 ? 0.8 + r() * 1.2 : 0);
    }
  }

  // Faces of every house, with windows, eaves and roof, in painter order.
  const LIGHT_IN = 0.27;
  const items = [];
  for (const h of houses) {
    const hr = rngFor('harbour:house:' + Math.round(h.x0 * 10) + ':' + Math.round(h.z0 * 10));
    const c = [(h.x0 + h.x1) / 2, (h.base + h.top) / 2, (h.z0 + h.z1) / 2];
    const faces = [];
    const front = [[h.x0, h.base, h.z0], [h.x1, h.base, h.z0], [h.x1, h.top, h.z0], [h.x0, h.top, h.z0]];
    faces.push({ kind: 'front', q: front });
    // Side faces: only the one turned toward the eye.
    if (eye[0] < h.x0) faces.push({ kind: 'side', q: [[h.x0, h.base, h.z1], [h.x0, h.base, h.z0], [h.x0, h.top, h.z0], [h.x0, h.top, h.z1]] });
    if (eye[0] > h.x1) faces.push({ kind: 'side', q: [[h.x1, h.base, h.z0], [h.x1, h.base, h.z1], [h.x1, h.top, h.z1], [h.x1, h.top, h.z0]] });
    // Roof: a low hip rising behind the eave; its front slope shows from below.
    const ov = 0.35, e0 = h.top + 0.15, rid = h.top + 1.9;
    const roof = [[h.x0 - ov, e0, h.z0 - ov], [h.x1 + ov, e0, h.z0 - ov], [h.x1 - 1.5, rid, c[2]], [h.x0 + 1.5, rid, c[2]]];
    const eave = [[h.x0 - ov, h.top - 0.12, h.z0 - ov], [h.x1 + ov, h.top - 0.12, h.z0 - ov], [h.x1 + ov, e0, h.z0 - ov], [h.x0 - ov, e0, h.z0 - ov]];
    // Windows: a grid on the front, per floor; some lit, the rest shuttered.
    const wins = [];
    const w = h.x1 - h.x0, cols = Math.max(1, Math.floor(w / 2.3)), pitch = w / cols;
    const floors = Math.floor((h.top - h.base - 3.4) / 2.9);
    for (let f = 0; f < floors; f++) {
      const y0 = h.base + 3.3 + f * 2.9;
      if (y0 + 1.4 > h.top - 0.6) break;
      for (let k = 0; k < cols; k++) {
        const xm = h.x0 + pitch * (k + 0.5);
        const lit = hr() < LIGHT_IN;
        wins.push({ lit, xm, y0,
          glass: [[xm - 0.42, y0, h.z0 - 0.02], [xm + 0.42, y0, h.z0 - 0.02], [xm + 0.42, y0 + 1.35, h.z0 - 0.02], [xm - 0.42, y0 + 1.35, h.z0 - 0.02]],
          shL: [[xm - 0.8, y0, h.z0 - 0.03], [xm - 0.45, y0, h.z0 - 0.03], [xm - 0.45, y0 + 1.35, h.z0 - 0.03], [xm - 0.8, y0 + 1.35, h.z0 - 0.03]],
          shR: [[xm + 0.45, y0, h.z0 - 0.03], [xm + 0.8, y0, h.z0 - 0.03], [xm + 0.8, y0 + 1.35, h.z0 - 0.03], [xm + 0.45, y0 + 1.35, h.z0 - 0.03]] });
      }
    }
    // Ground floor: a dark doorway or a lit shop front.
    const door = { lit: hr() < 0.3, q: [[c[0] - 0.8, h.base + 0.4, h.z0 - 0.02], [c[0] + 0.8, h.base + 0.4, h.z0 - 0.02], [c[0] + 0.8, h.base + 2.6, h.z0 - 0.02], [c[0] - 0.8, h.base + 2.6, h.z0 - 0.02]] };
    // A few side-face windows, dark.
    const sideWins = [];
    for (const f of faces) if (f.kind === 'side') {
      const xs = f.q[0][0];
      for (let fl = 0; fl < floors; fl++) if (hr() < 0.5) {
        const y0 = h.base + 3.3 + fl * 2.9, zm = h.z0 + 1.5 + hr() * (h.z1 - h.z0 - 3);
        sideWins.push([[xs, y0, zm - 0.4], [xs, y0, zm + 0.4], [xs, y0 + 1.3, zm + 0.4], [xs, y0 + 1.3, zm - 0.4]]);
      }
    }
    items.push({ h, dist: Math.hypot(c[0] - eye[0], c[1] - eye[1], c[2] - eye[2]), faces, roof, eave, wins, door, sideWins });
  }
  items.sort((a, b) => b.dist - a.dist);

  // Build both the upright and mirrored paths once.
  const build = (m) => items.map((it) => {
    const T = m ? mir : (p) => p;
    const P = (q) => poly(q.map(T));
    return {
      wall: it.h.wall,
      faces: it.faces.map((f) => ({ kind: f.kind, path: P(f.q) })).filter((f) => f.path),
      roof: P(it.roof), eave: P(it.eave),
      lit: it.wins.filter((w) => w.lit).map((w) => P(w.glass)).filter(Boolean),
      dark: it.wins.filter((w) => !w.lit).map((w) => P([w.shL[0], w.shR[1], w.shR[2], w.shL[3]])).filter(Boolean),
      open: it.wins.filter((w) => w.lit).flatMap((w) => [P(w.shL), P(w.shR)]).filter(Boolean),
      door: P(it.door.q), doorLit: it.door.lit,
      side: it.sideWins.map(P).filter(Boolean),
    };
  });
  const up = build(false), down = build(true);

  // Light sources for reflections: lit windows and the lamps.
  const lights = [];
  for (const it of items) for (const w of it.wins) if (w.lit) {
    const p = proj([w.xm, w.y0 + 0.7, it.h.z0]), q = proj([w.xm, -(w.y0 + 0.7), it.h.z0]);
    if (p && q) lights.push({ x: p[0], y: p[1], ry: q[1], a: 0.5 + r() * 0.5, s: 1 });
  }
  const lamps = [];
  for (const [x, z, dy] of [[-44, 0.5, 3.6], [-26, 0.5, 3.6], [-7, 0.5, 3.6], [14, 0.5, 3.6], [34, 0.5, 3.6], [55, 0.5, 3.6],
                              [-18, 12.5, 3], [22, 23, 3], [-30, 34, 3], [48, 40, 3], [8, 55, 3]]) {
    const y = H(x, z) + dy, p = proj([x, y, z]), q = proj([x, -y, z]);
    if (p && q) { lamps.push({ x: p[0], y: p[1], ry: q[1], r: cam.focal / cam.depth([x, y, z]) * 0.36 }); lights.push({ x: p[0], y: p[1], ry: q[1], a: 1, s: 2.2 }); }
  }

  // The rock the village stands on: its sea face, and the spur's end.
  const rockTop = [];
  for (let x = 110; x >= -84; x -= 1) if (H(x, 0) > 0.05) rockTop.push([x, H(x, 0), -0.5]);
  // Closed along the waterline itself, so the rock meets its own reflection.
  const foot = rockTop.slice().reverse().map(([x, , z]) => proj([x, 0, z])).filter(Boolean);
  const rockPath = pathOf([...rockTop.map(proj).filter(Boolean), ...foot]);
  const rockMir = pathOf([...rockTop.map((p) => proj(mir(p))).filter(Boolean), ...foot]);
  // Facets and strata on the rock.
  // Facets: planes of the sea cliff tilted to the afterglow, and the joints between them.
  const rockMarks = [], rockJoints = [];
  for (let k = 0; k < 90; k++) {
    const x = -56 + r() * 170, yT = H(x, 0); if (yT < 1) continue;
    const y = r() * yT, w = 1.5 + r() * 4, hh = 1 + r() * 3.5;
    const q = [[x, y, -0.6], [x - w, y - hh * 0.3, -0.6], [x - w * 0.8, Math.max(0, y - hh), -0.6], [x + w * 0.2, Math.max(0, y - hh * 0.9), -0.6]];
    const pq = q.map(proj); if (pq.every(Boolean)) rockMarks.push(pathOf(pq));
  }
  // Strata: the bedding dips seaward, so the joints run as long tilted bands.
  for (let k = 0; k < 70; k++) {
    const x0 = -60 + k * 2.6 + r() * 1.5, y0 = 0;
    const pts = [];
    for (let t = 0; t <= 1.0001; t += 0.1) {
      const x = x0 + t * 22, y = y0 + t * 16 + Math.sin(t * 5 + k) * 0.3;
      if (y > H(x, 0) - 0.2) break;
      const p = proj([x, y, -0.7]); if (p) pts.push(p);
    }
    if (pts.length > 2) rockJoints.push(nib(pts, wSwell(0.9 + r() * 1.6, 0.5, 0.55), { per: 3 }));
  }
  // Promenade under the front houses.
  const quay = poly([[-50, H(-50, 0) - 0.4, -0.6], [100, H(100, 0) - 0.4, -0.6], [100, H(100, 0) + 0.5, -0.6], [-50, H(-50, 0) + 0.5, -0.6]]);

  // Hill behind: a surface up to its ridge, terraced along contours.
  const ridgeZ = 290;
  const rw = makeWob(r, 6);
  const ridgeH = (x) => H(x, ridgeZ) - 40 + rw(x / 60) * 16 + rw(x / 17 + 4) * 4 - Math.max(0, 40 - x) * 1.2;
  const hillTop = [];
  for (let x = 220; x >= -90; x -= 2) hillTop.push(proj([x, ridgeH(x), ridgeZ]));
  const hill = pathOf([...hillTop.filter(Boolean), [1200, horizon + 40], [-200, horizon + 40]]);
  const terraces = [];
  for (let hh = 42; hh < 230; hh += 3.2) {
    const pts = [];
    for (let x = 200; x >= -70; x -= 2) {
      const z = (hh - 10 - 0.25 * Math.max(0, x) + 1.6 * Math.max(0, -x - 50)) / 0.7 + Math.sin(x / 11 + hh) * 2.2;
      if (z < 58 || z > ridgeZ - 4 || hh > ridgeH(x) - 2) { if (pts.length > 1) terraces.push({ hh, pts: pts.slice() }); pts.length = 0; continue; }
      const p = proj([x, hh, z]); if (p) pts.push(p);
    }
    if (pts.length > 1) terraces.push({ hh, pts });
  }
  const hillHouses = [];
  for (let k = 0; k < 9; k++) {
    const x = -30 + r() * 170, z = 90 + r() * 170, y = H(x, z);
    const q = poly([[x, y, z], [x + 6, y, z], [x + 6, y + 6, z], [x, y + 6, z]]);
    const wq = poly([[x + 2.5, y + 2.5, z - 0.1], [x + 3.5, y + 2.5, z - 0.1], [x + 3.5, y + 3.7, z - 0.1], [x + 2.5, y + 3.7, z - 0.1]]);
    if (q) hillHouses.push({ q, wq, lit: r() < 0.6 });
  }

  // Boats: Ligurian gozzi seen broadside, double-ended with a high stem, riding
  // the swell. Profiles in metres (u along, v up), scaled by their own depth.
  const boats = [];
  for (const [x, z, len, dir, col, lamp] of [[-6, -96, 5.4, 1, 'blue', false], [-36, -112, 4.8, -1, 'green', false], [8, -132, 6, -1, 'orange', true]]) {
    const w = proj([x, 0, z]); if (!w) continue;
    const k = cam.focal / cam.depth([x, 0, z]), hl = len / 2;
    const at = (u, vv) => [w[0] + u * dir * k, w[1] - vv * k];
    const sheer = [], keel = [];
    for (let i = 0; i <= 20; i++) { const u = -hl + i / 20 * len, t = Math.abs(u) / hl; sheer.push([u, 0.82 + Math.pow(t, 2.6) * 0.42]); }
    for (let i = 20; i >= 0; i--) { const u = -hl + i / 20 * len, t = Math.abs(u) / hl; keel.push([u * (1 - 0.06 * (1 - t)), -0.28 + Math.pow(t, 3) * 0.9]); }
    const stemB = [[hl + 0.12, 1.3], [hl - 0.02, 1.24]], stemS = [[-hl + 0.02, 1.2], [-hl - 0.1, 1.24]];
    const hullUV = [...stemS, ...sheer, ...stemB, ...keel];
    const band = [...sheer, ...sheer.slice().reverse().map(([u, vv]) => [u, vv - 0.2])];
    const boot = keel.map(([u, vv]) => [u, Math.max(vv, 0.02)]);
    const hull = pathOf(hullUV.map(([u, vv]) => at(u, vv)));
    const stripe = pathOf(band.map(([u, vv]) => at(u, vv)));
    const below = pathOf([...boot.map(([u, vv]) => at(u, vv)), ...boot.slice().reverse().map(([u]) => at(u, 0.02))]);
    const hullM = pathOf(hullUV.map(([u, vv]) => at(u, -vv)));
    const thwarts = [-0.3, 0.9].map((u) => pathOf([at(u - 0.06, 0.84), at(u + 0.06, 0.84), at(u + 0.06, 1.0), at(u - 0.06, 1.0)]));
    const mast = lamp ? [at(-hl + 0.6, 0.9), at(-hl + 0.6, 2.0)] : null;
    boats.push({ hull, stripe, below, hullM, thwarts, col, mast, lantern: lamp ? at(-hl + 0.6, 2.05) : null,
                 lanternM: lamp ? at(-hl + 0.6, -2.05) : null, k, dist: cam.depth([x, 0, z]) });
    if (lamp) { const L = at(-hl + 0.6, 2.05), M = at(-hl + 0.6, -2.05); lights.push({ x: L[0], y: L[1], ry: M[1], a: 1, s: 1.4 }); }
  }
  const waterline = proj([0, 0, -0.5])[1];
  return { cam, H, horizon, up, down, lights, lamps, rockPath, rockMir, rockMarks, rockJoints, quay, hill, terraces, hillHouses, boats, waterline };
});

const HARB_SEA = once(() => {
  const r = rngFor('harbour:sea'), v = HARB();
  // Ripple lenses: sea-coloured slivers that break every reflection into strokes,
  // longer and taller toward the viewer as the swell comes closer.
  const ripples = new Path2D();
  for (let y = v.horizon + 2; y < W + 10; ) {
    const k = (y - v.horizon) / (W - v.horizon), hgt = 0.6 + k * 3.5, gap = 3 + k * 12;
    for (let x = -40 + r() * 30; x < W + 40;) {
      const len = 12 + r() * (30 + k * 140);
      ripples.addPath(pathOf([[x, y], [x + len * 0.5, y - hgt * (0.5 + r() * 0.5)], [x + len, y], [x + len * 0.5, y + hgt * (0.5 + r() * 0.5)]]));
      x += len + 10 + r() * (20 + k * 70);
    }
    y += gap;
  }
  // Streaks under every light: dashes that spread and break as they near the viewer.
  const streaks = new Path2D();
  for (const L of v.lights) {
    const n = Math.round(10 + L.s * 14);
    for (let i = 0; i < n; i++) {
      const u = i / n, y = L.ry + (L.ry - L.y) * -0.02 + Math.pow(u, 1.35) * (W + 20 - L.ry) * 0.35 * L.s;
      if (y < v.waterline + 2 || r() > L.a * (1 - u * 0.8)) continue;
      const half = (0.8 + u * 7) * (0.6 + r() * 0.8) * L.s, xo = (r() - 0.5) * u * 10;
      const hh = 0.5 + u * 1.6;
      streaks.addPath(pathOf([[L.x + xo - half, y], [L.x + xo, y - hh], [L.x + xo + half, y], [L.x + xo, y + hh]]));
    }
  }
  // Long evening cloud, its underside lit by the afterglow: warmer nearer the sun.
  const clouds = [];
  for (let k = 0; k < 9; k++) {
    const y = 360 + k * 38 + r() * 24, x0 = 440 + r() * 300 - k * 14, len = 200 + r() * 320, th = 7 + r() * 11;
    const top = [], bot = [];
    for (let i = 0; i <= 24; i++) {
      const u = i / 24, e = Math.sin(Math.PI * u);
      top.push([x0 + u * len, y - th * e * (0.7 + 0.5 * Math.sin(u * 13 + k))]);
      bot.push([x0 + u * len, y + th * 0.5 * e]);
    }
    const body = pathOf([...top, ...bot.reverse()]);
    const lit = pathOf([...bot.slice().reverse().map(([x, yy], i) => [x, yy - th * (0.35 + 0.25 * Math.sin(i * 0.9 + k))]), ...bot.slice().map(([x, yy]) => [x, yy + 1])]);
    clouds.push({ body, lit, warm: clamp((y - 360) / 330, 0, 1) });
  }
  // Moon and the evening star.
  const moon = new Path2D(); moon.arc(912, 128, 15, 0, TAU);
  const bite = new Path2D(); bite.arc(905, 124, 14, 0, TAU);
  const stars = [];
  for (let k = 0; k < 40; k++) { const x = r() * W, y = r() * 300; if (r() < 0.7 - y / 400) stars.push([x, y, 0.5 + r() * 0.9]); }
  // Foreground rocks at the lower left, and foam where the swell meets them.
  const rocks = [cut([[-40, 1120], [-30, 930], [40, 905], [110, 930], [150, 975], [230, 990], [290, 1040], [330, 1120]], r, { amp: 6, per: 8 }),
                 cut([[250, 1120], [300, 1010], [360, 998], [420, 1030], [470, 1120]], r, { amp: 4, per: 8 })];
  const rockLit = [];
  for (const [x, y, l] of [[20, 915, 60], [100, 935, 50], [300, 1008, 40], [365, 1000, 30]]) rockLit.push(nib([[x, y], [x + l * 0.5, y - 2], [x + l, y + 6]], wSwell(3, 0.45, 0.5), { per: 6 }));
  const foam = new Path2D();
  for (let k = 0; k < 90; k++) {
    const x = r() * 480, y = 975 + r() * 60 + x * 0.1;
    foam.addPath(pathOf([[x, y], [x + 6 + r() * 16, y - 1], [x + 24, y + 1]]));
  }
  return { clouds, ripples, streaks, moon, bite, stars, rocks, rockLit, foam };
});

scene('harbour', {
  inks: ['yellow', 'orange', 'pink', 'blue', 'green', 'indigo'],
  plates(g, ink) {
    const v = HARB(), s = HARB_SEA(), hz = v.horizon;

    /* sky: blue hour — deep overhead, violet, then the afterglow on the sea horizon */
    const skyStops = { blue: [[0, 0.78], [0.55, 0.58], [0.85, 0.34], [1, 0.16]], indigo: [[0, 0.42], [0.5, 0.18], [0.8, 0.04], [1, 0]],
                       pink: [[0, 0], [0.55, 0.08], [0.85, 0.2], [1, 0.3]], yellow: [[0, 0], [0.8, 0], [1, 0.22]], orange: [[0, 0], [0.85, 0.02], [1, 0.14]] }[ink];
    if (skyStops) shade(g, null, { x0: 0, y0: 0, x1: 0, y1: hz, stops: skyStops });
    // The afterglow sits low on the right, where the sun went down.
    if (ink === 'blue' || ink === 'indigo') shade(g, null, { x: 1000, y: hz + 20, r0: 0, r: 420, stops: [[0, 0.6], [1, 0]], cut: true });
    if (ink === 'pink') shade(g, null, { x: 1000, y: hz + 20, r0: 0, r: 420, stops: [[0, 0.2], [1, 0]] });
    if (ink === 'yellow' || ink === 'orange') shade(g, null, { x: 1000, y: hz + 10, r0: 0, r: 220, stops: [[0, ink === 'yellow' ? 0.3 : 0.12], [1, 0]] });
    for (const c of s.clouds) {
      own(g, ink, c.body, { blue: 0.66, indigo: 0.36, pink: 0.16 });
      g.save(); g.clip(c.body);
      if (ink === 'blue' || ink === 'indigo') carve(g, c.lit);
      if (ink === 'pink') print(g, c.lit, 0.5 * c.warm + 0.1);
      if (ink === 'orange') print(g, c.lit, 0.18 * c.warm);
      if (ink === 'yellow') print(g, c.lit, 0.2 * c.warm);
      g.restore();
    }
    carve(g, s.moon);
    if (ink === 'blue') { g.save(); g.clip(s.moon); print(g, s.bite, 0.55); g.restore(); }
    if (ink === 'indigo') { g.save(); g.clip(s.moon); print(g, s.bite, 0.25); g.restore(); }
    if (ink === 'yellow') { g.save(); g.clip(s.moon); print(g, s.moon, 0.25); carve(g, s.bite); g.restore(); }
    for (const [x, y, rad] of s.stars) { const p = new Path2D(); p.arc(x, y, rad, 0, TAU); carve(g, p); }

    /* hill: terraced vineyards going dark, dry-stone walls catching the last sky */
    own(g, ink, v.hill, { green: 0.62, blue: 0.62, indigo: 0.5 });
    g.save(); g.clip(v.hill);
    for (const t of v.terraces) {
      const p = new Path2D(); t.pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y));
      // Wall tops pale against the sky; the vines below them in a dark band.
      if (ink === 'indigo' || ink === 'green') { g.save(); g.globalCompositeOperation = 'destination-out'; g.lineWidth = 1.5; g.translate(0, -1); g.stroke(p); g.restore(); }
      if (ink === 'indigo') { g.lineWidth = 1.1; tone(g, 1); g.save(); g.translate(0, 1.3); g.stroke(p); g.restore(); }
    }
    for (const hh of v.hillHouses) {
      own(g, ink, hh.q, { pink: 0.25, yellow: 0.2, blue: 0.35, indigo: 0.1 });
      if (hh.wq) own(g, ink, hh.wq, hh.lit ? { yellow: 0.6, orange: 0.15 } : { indigo: 0.6, blue: 0.4 });
    }
    g.restore();

    const DUSK = { blue: 0.24, indigo: 0.06 };
    const add = (a, b, k) => { const o = Object.assign({}, a); for (const key in b) o[key] = (o[key] || 0) + b[key] * (k || 1); return o; };
    const paintHouses = (list, mirrored) => {
      for (const it of list) {
        for (const f of it.faces) {
          const spec = f.kind === 'front' ? add(it.wall, DUSK) : add(mixInk(it.wall, {}, 0.2), { blue: 0.34, indigo: 0.1 });
          own(g, ink, f.path, mirrored ? add(mixInk(spec, {}, 0.15), { blue: 0.22, indigo: 0.06 }) : spec);
        }
        if (it.eave) own(g, ink, it.eave, { indigo: 0.55, blue: 0.5, orange: 0.25 });
        if (it.roof) own(g, ink, it.roof, { blue: 0.42, indigo: 0.2, pink: 0.12, orange: 0.08 });
        if (mirrored) continue;
        for (const d of it.dark) own(g, ink, d, { green: 1, indigo: 0.3, blue: 0.1 });
        for (const o of it.open) own(g, ink, o, { green: 1, indigo: 0.25 });
        for (const w of it.lit) own(g, ink, w, { yellow: 1, orange: 0.4 });
        for (const w of it.side) own(g, ink, w, { indigo: 0.55, blue: 0.3, green: 0.2 });
        if (it.door) own(g, ink, it.door, it.doorLit ? { yellow: 0.7, orange: 0.35 } : { indigo: 0.75, blue: 0.4, orange: 0.2 });
      }
    };
    /* sea: the sky's gradient turned over, darker toward the viewer */
    const sea = pathOf([[-60, hz], [W + 60, hz], [W + 60, W + 60], [-60, W + 60]]);
    own(g, ink, sea, {});
    const seaStops = { blue: [[0, 0.3], [0.25, 0.55], [1, 0.72]], indigo: [[0, 0.02], [0.3, 0.2], [1, 0.5]],
                       pink: [[0, 0.24], [0.3, 0.08], [1, 0]], yellow: [[0, 0.12], [0.2, 0]] }[ink];
    if (seaStops) shade(g, sea, { x0: 0, y0: hz, x1: 0, y1: W, stops: seaStops });
    if (ink === 'blue' || ink === 'indigo') shade(g, sea, { x: 1000, y: hz, r0: 0, r: 360, stops: [[0, 0.7], [1, 0]], cut: true });
    if (ink === 'pink') shade(g, sea, { x: 1000, y: hz, r0: 0, r: 360, stops: [[0, 0.16], [1, 0]] });

    /* reflections: the mirrored village, muted, then broken by the swell */
    g.save(); g.clip(sea);
    own(g, ink, v.rockMir, { indigo: 0.6, blue: 0.45, orange: 0.28 });
    paintHouses(v.down, true);
    for (const b of v.boats) own(g, ink, b.hullM, { blue: 0.36, indigo: 0.1, [b.col]: 0.2 });
    const rip = { blue: 0.58, indigo: 0.3, pink: 0.06 };
    own(g, ink, s.ripples, rip);
    carve(g, s.streaks);
    if (ink === 'yellow') print(g, s.streaks, 0.62);
    if (ink === 'orange') print(g, s.streaks, 0.18);
    g.restore();

    /* village: each house in painter order owns its faces */
    paintHouses(v.up, false);

    /* the rock under the village and the promenade along its top */
    own(g, ink, v.rockPath, { indigo: 0.55, orange: 0.34, blue: 0.3, pink: 0.06 });
    g.save(); g.clip(v.rockPath);
    for (const m of v.rockMarks) own(g, ink, m, { indigo: 0.3, orange: 0.3, blue: 0.22, pink: 0.16 });
    if (ink === 'indigo') for (const j of v.rockJoints) print(g, j, 1);
    // The seaward end of the spur catches the afterglow.
    if (ink === 'indigo' || ink === 'blue') shade(g, null, { x: 1000, y: v.waterline, r0: 0, r: 380, stops: [[0, 0.55], [1, 0]], cut: true });
    if (ink === 'pink') shade(g, null, { x: 1000, y: v.waterline, r0: 0, r: 380, stops: [[0, 0.3], [1, 0]] });
    g.restore();
    if (v.quay) own(g, ink, v.quay, { yellow: 0.24, orange: 0.12, blue: 0.2 });

    /* lamps: open the dusk round each, then a warm core */
    for (const L of v.lamps) {
      if (ink === 'blue' || ink === 'indigo' || ink === 'green' || ink === 'pink')
        shade(g, null, { x: L.x, y: L.y, r0: 0, r: L.r * 11, stops: [[0, 1], [0.3, 0.5], [1, 0]], cut: true });
      if (ink === 'yellow') shade(g, null, { x: L.x, y: L.y, r0: 0, r: L.r * 11, stops: [[0, 0.75], [0.35, 0.25], [1, 0]] });
      if (ink === 'orange') shade(g, null, { x: L.x, y: L.y, r0: 0, r: L.r * 3, stops: [[0, 0.2], [1, 0]] });
      const core = new Path2D(); core.arc(L.x, L.y, L.r, 0, TAU); carve(g, core);
