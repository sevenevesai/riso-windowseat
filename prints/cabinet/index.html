<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
const CSS=720, W=1080, OUT=2160, K=OUT/W, PITCH=3.4*K, DUR=5;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const REG_SCALE = 0.6;
const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      // +0.5 puts dot centres on pixel centres: a 45° lattice otherwise lands on pixel
      // corners and its smallest dots jump 0 → 4 → 12 px, contouring gentle ramps.
      const wx = ((x % S) + S + 0.5) % S, wy = ((y % S) + S + 0.5) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
const DITHER = (() => { const r = mulberry32(0x5eed), a = new Float32Array(65536); for (let i = 0; i < a.length; i++) a[i] = r(); return a; })();
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      // a fixed dither in mid-tones breaks the remaining dot-size steps; paper and solids untouched
      const c = cover + (DITHER[(y & 255) * 256 + (x & 255)] - 0.5) * 0.09 * Math.min(1, cover * 10) * (1 - cover);
      s[i + 3] = c >= 1 || c > sc.th[row + (x % sc.S)] ? 255 : 0;   // a 100% solid closes up, as on the drum
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    if (ONLY && ink !== ONLY) continue;
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx * K * REG_SCALE, ry * K * REG_SCALE);   // fine-detail plates: a tighter press
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined

scene('nautilus', {
  inks: ['orange', 'pink', 'indigo'],
  plates(g, ink) {
    const N = nautilus();
    if (QS.get('debug') === 'lines') {                 // construction check: walls and septa only
      if (ink !== 'indigo') return;
      g.lineWidth = 1; g.stroke(N.sil);
      for (const w of N.walls) print(g, w, 1);
      for (const s of N.septa) print(g, s, 1);
      for (const n of N.necks) print(g, n, 1);
      return;
    }
    const ch = { orange: 'o', pink: 'p', indigo: 'i' }[ink];
    if (ink === 'pink') for (const [x, y, r] of N.future) { g.globalAlpha = 1; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
    g.save(); g.clip(N.sil);
    stamp(g, N.F[ch]);
    carve(g, N.win);
    g.clip(N.win);
    stamp(g, N.X[ch]);
    for (const w of N.walls) carve(g, w);
    for (const s of N.septa) carve(g, s);
    for (const n of N.necks) carve(g, n);
    if (ink === 'indigo') {
      for (const s of N.backs) print(g, s, 0.9);
      for (const w of N.walls) keyline(g, w, 0.5, 0.7);
      for (const n of N.necks) keyline(g, n, 0.45, 0.8);
    }
    if (ink === 'pink') for (const s of N.septa) print(g, s, 0.08);
    g.restore();
    if (ink === 'indigo') {
      // contour: heavier where the edge turns from the light
      const P = N.pts, n = P.length, cw = [];
      for (let i = 0; i < n; i++) {
        const a = P[(i - 1 + n) % n], c = P[(i + 1) % n];
        const tx = c[0] - a[0], ty = c[1] - a[1], m = Math.hypot(tx, ty) || 1;
        const ox = ty / m, oy = -tx / m;             // outward for a clockwise screen contour
        cw.push(0.45 + 1.5 * Math.max(0, ox * 0.62 + oy * 0.78));
      }
      const ring = P.concat([P[0]]);
      print(g, nib(ring, u => cw[Math.min(n - 1, Math.round(u * n))], { raw: true }), 1);
      print(g, nib(N.apPts, () => 0.6, { raw: true }), 0.9);
      g.save(); g.clip(N.sil); g.clip(N.win);
      g.restore();
      // callus: its groove, and a few growth lines lapping onto it
      g.save(); { const c = new Path2D(); c.rect(-W, -W, 3 * W, 3 * W); c.addPath(N.win); g.clip(c, 'evenodd'); }
      g.save(); g.clip(N.callus); g.globalCompositeOperation = 'destination-out';
      shade(g, null, { x: N.cx - 4, y: N.cy - 5, r0: 0, r: 26, stops: [[0, 1], [0.7, 0.9], [1, 0.4]] });
      g.restore();
      keyline(g, N.callus, 0.7, 0.85);
      g.restore();
      g.save(); g.clip(N.sil); keyline(g, N.win, 0.7, 0.9); g.restore();
    }
  },
});

/* ── II. Arranged diatoms, dark-field ─────────────────────────────────────────
   A Victorian arranged slide: frustules placed by hand into a rosette, seen in
   dark-field, where the glass shows only where it scatters light: rims, costae,
   areolae. The drawing is therefore made of light. Structures are laid down
   additively into a three-channel light buffer (gold, rose, ice), glowed with a
   deterministic box blur, and only then turned into ink: the dark ground is an
   indigo+pink overprint carved wherever there is light, halos take the hue's
   ink, and the brightest cores fall back to bare paper. */

/** Separable box blur on one Float32 channel (w×h), radius r px, in place via tmp. */
function boxBlur(a, w, h, r, tmp) {
  const n = 2 * r + 1;
  for (let y = 0; y < h; y++) {                       // horizontal
    const o = y * w; let s = 0;
    for (let x = -r; x <= r; x++) s += a[o + clamp(x, 0, w - 1)];
    for (let x = 0; x < w; x++) {
      tmp[o + x] = s / n;
      s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {                       // vertical
    let s = 0;
    for (let y = -r; y <= r; y++) s += tmp[clamp(y, 0, h - 1) * w + x];
    for (let y = 0; y < h; y++) {
      a[y * w + x] = s / n;
      s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
    }
  }
}

  function actinoptychus(x, y, R, rot, rng) {
    rimBand(x, y, R, rng, { w: 1.9, inner: 0.9 });
    const n = 6, hex = [];
    for (let i = 0; i < 6; i++) hex.push(pol(x, y, 0.15 * R, rot + i / 6 * TAU + TAU / 12));
    hue = HUE.gold; line(polyPath(hex, true), 0.9, 0.75);
    for (let s = 0; s < n; s++) {
      const a0 = rot + s / n * TAU, a1 = a0 + TAU / n, raised = s % 2 === 0;
      const [ax, ay] = pol(x, y, 0.15 * R, a0), [bx, by] = pol(x, y, 0.9 * R, a0);
      hue = HUE.ice; line(seg(ax, ay, bx, by), 0.9, 0.9);
      // areolae on a hex lattice, clipped to the sector
      const d = 0.07 * R, wedge = new Path2D();
      wedge.moveTo(...pol(x, y, 0.16 * R, a0 + 0.03)); wedge.arc(x, y, 0.88 * R, a0 + 0.012, a1 - 0.012); wedge.lineTo(...pol(x, y, 0.16 * R, a1 - 0.03)); wedge.closePath();
      L.save(); L.clip(wedge);
      for (let j = -20; j <= 20; j++) for (let i = -20; i <= 20; i++) {
        const px = x + (i + (j & 1) * 0.5) * d, py = y + j * d * 0.866;
        const rr = Math.hypot(px - x, py - y);
        if (rr > 0.9 * R) continue;
        const ang = Math.atan2(py - y, px - x), mid = Math.cos(((ang - a0) / (a1 - a0) - 0.5) * Math.PI * 2 * 0.5);
        const a = raised ? 0.42 + 0.22 * mid : 0.2 + 0.25 * (1 - mid);
        hue = HUE.ice; L.strokeStyle = col(a); L.lineWidth = 0.4;
        const hp = new Path2D();
        for (let k = 0; k < 6; k++) { const [hx, hy] = pol(px, py, d * 0.46, k / 6 * TAU + TAU / 12); k ? hp.lineTo(hx, hy) : hp.moveTo(hx, hy); }
        hp.closePath(); L.stroke(hp);
        if (raised) { hue = HUE.gold; dot(px, py, 0.13 * d, 0.55 + 0.3 * mid); }
      }
      L.restore();
      if (raised) { hue = HUE.gold; const [px, py] = pol(x, y, 0.85 * R, (a0 + a1) / 2); dot(px, py, 0.025 * R, 1); }
    }
  }

  function triceratium(x, y, R, rot, rng) {
    hue = HUE.rose;
    const pts = [];
    for (let k = 0; k < 3; k++) {
      const v = rot + k / 3 * TAU, m = v + TAU / 6;
      pts.push(pol(x, y, R * 0.97, v - 0.1), pol(x, y, R, v), pol(x, y, R * 0.97, v + 0.1));
      pts.push(pol(x, y, R * 0.55, m));                         // sides bow gently outward
    }
    const outline = polyPath(curve(pts, true, 10), true);
    line(outline, 1.6, 1);
    const inner = new Path2D(); inner.addPath(outline, new DOMMatrix().translate(x, y).scale(0.9).translate(-x, -y));
    line(inner, 0.55, 0.45);
    L.save(); L.clip(inner);
    const d = 0.1 * R;
    for (let j = -16; j <= 16; j++) for (let i = -16; i <= 16; i++) {
      const px = x + (i + (j & 1) * 0.5) * d, py = y + j * d * 0.866, rr = Math.hypot(px - x, py - y) / R;
      const s = d * 0.5 * (rr < 0.12 ? 1.25 : 0.96);
      const hp = new Path2D();
      for (let k = 0; k < 6; k++) { const [hx, hy] = pol(px, py, s, k / 6 * TAU + rot); k ? hp.lineTo(hx, hy) : hp.moveTo(hx, hy); }
      hp.closePath();
      line(hp, 0.45, 0.25 + 0.35 * (1 - rr));
      dot(px, py, 0.07 * d, 0.3 + 0.4 * (1 - rr));
    }
    L.restore();
    for (let k = 0; k < 3; k++) {                               // ocelli at the corners
      const [ox, oy] = pol(x, y, 0.74 * R, rot + k / 3 * TAU);
      line(circ(ox, oy, 0.13 * R), 0.9, 0.95);
      for (let j = 0; j < 22; j++) { const th = j * 2.39996, rr = 0.11 * R * Math.sqrt(j / 22); dot(ox + rr * Math.cos(th), oy + rr * Math.sin(th), 0.009 * R, 0.8); }
    }
  }

  function coscinodiscus(x, y, R, rot, rng) {
    hue = HUE.gold;
    rimBand(x, y, R, rng, { w: 1.5, inner: 0.92 });
    for (let k = 0; k < 7; k++) { const [a, b] = k ? pol(x, y, 0.07 * R, rot + k / 6 * TAU) : [x, y]; dot(a, b, 0.028 * R, 0.8); }
    const fas = 9;                                              // fascicles: radial rows, grouped
    for (let r = 0.13 * R; r < 0.9 * R; r += 0.06 * R) {
      const n = Math.max(6, Math.round(TAU * r / (0.06 * R)));
      for (let i = 0; i < n; i++) {
        const th = rot + i / n * TAU + (Math.round(r / (0.06 * R)) % 2) * 0.5 / n * TAU;
        const [a, b] = pol(x, y, r, th);
        const edge = Math.abs(Math.sin(th * fas / 2 - rot));
        dot(a, b, R * (0.008 + 0.007 * r / R), 0.4 + 0.35 * edge);
      }
    }
  }

  function asteromphalus(x, y, R, rot, rng) {
    hue = HUE.ice;
    rimBand(x, y, R, rng, { w: 1.4, inner: 0.9 });
    const n = 7;
    line(circ(x, y, 0.42 * R), 0.8, 0.8);
    for (let k = 0; k < n; k++) {
      const th = rot + k / n * TAU, narrow = k === 0;
      const [a, b] = pol(x, y, 0.06 * R, th), [c, d] = pol(x, y, 0.42 * R, th);
      line(seg(a, b, c, d), 0.7, 0.9);
      // the hyaline ray continues to the margin as a pair of fine lines
      const hw = narrow ? 0.018 : 0.04;
      for (const s of [-1, 1]) {
        const [e, f] = pol(x, y, 0.42 * R, th + s * hw * 2.2), [gx, gy] = pol(x, y, 0.88 * R, th + s * hw);
        line(seg(e, f, gx, gy), 0.55, 0.75);
      }
      hue = HUE.gold;
      const [px, py] = pol(x, y, 0.88 * R, th); dot(px, py, 0.03 * R, 0.95);
      hue = HUE.ice;
      // areolate sector between rays
      const a0 = th + 0.08, a1 = th + TAU / n - 0.08;
      for (let r = 0.48 * R; r < 0.86 * R; r += 0.05 * R) {
        const m = Math.round((a1 - a0) * r / (0.05 * R));
        for (let i = 0; i <= m; i++) { const [px2, py2] = pol(x, y, r, lerp(a0, a1, i / Math.max(1, m))); dot(px2, py2, 0.012 * R, 0.55); }
      }
    }
  }

  function navicula(x, y, len, wid, rot, rng, h) {
    hue = h || HUE.ice;
    const c = Math.cos(rot), s = Math.sin(rot), P = (u, v) => [x + u * c - v * s, y + u * s + v * c];
    const half = len / 2, wf = t => wid * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(t), 2.3)), 0.72);
    const top = [], bot = [];
    for (let i = 0; i <= 80; i++) { const t = -1 + 2 * i / 80; top.push(P(t * half, -wf(t))); bot.push(P(t * half, wf(t))); }
    const out = polyPath(top.concat(bot.reverse()), true);
    line(out, 1.25, 1);
    // raphe with central and terminal nodules
    line(polyPath([P(-0.93 * half, 0), P(-0.07 * half, 0)]), 0.6, 0.95);
    line(polyPath([P(0.07 * half, 0), P(0.93 * half, 0)]), 0.6, 0.95);
    fillL(cut(ringPts(...P(0, 0), 0.06 * half, 0.28 * wid, 10, rot), rng, { amp: 0.2 }), 0.25);
    dot(...P(-0.94 * half, 0), 0.9, 0.9); dot(...P(0.94 * half, 0), 0.9, 0.9);
    // striae: radiate at the centre, converge toward the apices
    for (let u = -0.9 * half; u <= 0.9 * half; u += 1.75) {
      const t = u / half; if (Math.abs(t) < 0.07) continue;
      const w0 = wf(t), lean = -0.35 * t;
      for (const sg of [-1, 1]) {
        const a = P(u, sg * 0.2 * wid), b = P(u + lean * w0 * 0.8, sg * (w0 - 0.7));
        line(seg(a[0], a[1], b[0], b[1]), 0.42, 0.5);
      }
    }
  }

  function cyclotella(x, y, R, rot, rng) {
    hue = HUE.gold;
    line(circ(x, y, R), 1.1, 1);
    for (let i = 0; i < 28; i++) {
      const th = rot + i / 28 * TAU, [a, b] = pol(x, y, 0.6 * R, th), [c, d] = pol(x, y, 0.93 * R, th);
      line(seg(a, b, c, d), 0.45, 0.6);
    }
    line(circ(x, y, 0.6 * R), 0.5, 0.45);
    for (let i = 0; i < 4; i++) { const [a, b] = pol(x, y, 0.3 * R * rng(), rng() * TAU); dot(a, b, 0.05 * R, 0.8); }
  }

  /* The arrangement: six-fold, each specimen a slightly different individual,
     placed a hair off true as a hand with a bristle places them. */
  const rng = rngFor('diatoms:place'), J = () => (rng() - 0.5);
  const [X0, Y0] = FC, up = -Math.PI / 2;
  arachnoidiscus(X0, Y0, 186, 0.03, rng);
  for (let k = 0; k < 6; k++) {
    const th = up + k / 6 * TAU;
    if (k % 2 === 0) actinoptychus(...pol(X0, Y0 + J(), 336 + J() * 3, th), 94 + J() * 3, th + J() * 0.08, rng);
    else triceratium(...pol(X0, Y0, 332 + J() * 3, th), 92 + J() * 3, th + Math.PI + J() * 0.06, rng);
    asteromphalus(...pol(X0, Y0, 222, th + TAU / 12), 20 + J() * 1.5, rng() * TAU, rng);
    navicula(...pol(X0, Y0, 398 + J() * 3, th + TAU / 12), 112 + J() * 4, 18 + J(), th + TAU / 12 + J() * 0.05, rng);
    coscinodiscus(...pol(X0, Y0, 268, th + TAU / 12), 22 + J() * 1.5, rng() * TAU, rng);
  }
  // the border: a ring of small valves, alternately round and boat-shaped
  for (let k = 0; k < 48; k++) {
    const th = up + k / 48 * TAU + TAU / 96;
    if (k % 2) cyclotella(...pol(X0, Y0, 452 + J(), th), 7.5 + J() * 0.8, rng() * TAU, rng);
    else navicula(...pol(X0, Y0, 452 + J(), th), 26 + J() * 2, 5.2, th + Math.PI / 2 + J() * 0.1, rng, HUE.rose);
  }
  // loose fragments and specks: the field is never perfectly clean
  const dr = rngFor('diatoms:debris');
  for (let i = 0; i < 70; i++) {
    const r = Math.sqrt(dr()) * (FR - 12), th = dr() * TAU, [px, py] = pol(X0, Y0, r, th);
    hue = [HUE.gold, HUE.ice, HUE.rose][Math.floor(dr() * 3)];
    if (dr() < 0.7) dot(px, py, 0.3 + dr() * 0.9, 0.35 + dr() * 0.5);
    else { const a = dr() * TAU, l = 2 + dr() * 7; line(seg(px, py, px + Math.cos(a) * l, py + Math.sin(a) * l), 0.5, 0.4); }
  }

  // — glow, then ink —
  const img = L.getImageData(0, 0, OUT, OUT).data, n = OUT * OUT;
  const ch = [0, 1, 2].map(c => { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = img[i * 4 + c] / 255; return a; });
  const halo = ch.map(a => Float32Array.from(a)), wide = ch.map(a => Float32Array.from(a));
  for (const a of halo) gaussish(a, OUT, OUT, Math.round(1.2 * K));
  for (const a of wide) gaussish(a, OUT, OUT, Math.round(5 * K));
  const I = { yellow: layer(), pink: layer(), indigo: layer() };
  const fr2 = (FR * K) ** 2, fcx = FC[0] * K, fcy = FC[1] * K;
  for (let j = 0, i = 0; j < OUT; j++) for (let x = 0; x < OUT; x++, i++) {
    const dx = x + 0.5 - fcx, dy = j + 0.5 - fcy, d2 = dx * dx + dy * dy;
    if (d2 > fr2 * 1.01) continue;
    const g = ch[0][i] + halo[0][i] * 0.42 + wide[0][i] * 0.2;
    const r = ch[1][i] + halo[1][i] * 0.42 + wide[1][i] * 0.2;
    const b = ch[2][i] + halo[2][i] * 0.42 + wide[2][i] * 0.2;
    const lum = g + r + b, tot = lum || 1;
    const white = smooth(0.62, 1.25, lum), glow = smooth(0.02, 0.34, lum) * (1 - white);
    const ground = 1 - smooth(0.0, 0.22, lum);
    const vig = Math.sqrt(d2) / (FR * K);
    I.indigo[i] = 255 * (ground * 0.95 + glow * (b / tot) * 0.45 + glow * (r / tot) * 0.08);
    I.pink[i] = 255 * (ground * (0.12 + 0.12 * vig * vig) + glow * (r / tot) * 0.62 + glow * (g / tot) * 0.22);
    I.yellow[i] = 255 * (ground * (0.42 + 0.1 * vig) + glow * (g / tot) * 0.95 + glow * (r / tot) * 0.1);
  }
  const field = circ(FC[0], FC[1], FR);
  return { I, field, FC, FR };
});

scene('diatoms', {
  inks: ['yellow', 'pink', 'indigo'],
  plates(g, ink) {
    const D = diatoms();
    stamp(g, D.I[ink], D.field);
    if (ink === 'indigo') {                          // the field stop: a crisp edge with a hair of spread
      keyline(g, D.field, 1.2, 1);
    }
  },
});

/* ── III. Luna moth, set ─────────────────────────────────────────────────────
   Actias luna as a set specimen, dorsal view, proportions taken from a pinned
   museum specimen (Commons: "Actias luna (luna moth) (17257003162).jpg").
   The right half is authored in that photo's pixel frame (body axis x=490) and
   mirrored, with a hair of asymmetry from setting. Veins radiate from the end
   of each discal cell, where the eyespot sits; the engraved texture is lines
   interpolated between neighbouring veins, so the scale rows follow the wing's
   own structure. Inks: yellow and green make the lime; pink and violet the
   costa and margins; violet also carries the engraved line. */

const luna = memo(() => {
  const S = 0.985, OY = 64;
  const P = (x, y, side) => [540 + side * (x - 490) * S, OY + y * S];
  const rot = (pts, side, a) => {                      // setting asymmetry: a slight turn about the wing root
    const [ox, oy] = P(505, 305, side), c = Math.cos(a), s = Math.sin(a);
    return pts.map(([x, y]) => [ox + (x - ox) * c - (y - oy) * s, oy + (x - ox) * s + (y - oy) * c]);
  };
  const side = (pts, sd, a) => rot(pts.map(([x, y]) => P(x, y, sd)), sd, a || 0);

  // — right half, photo coordinates —
  const FORE = [[508, 298], [540, 292], [585, 262], [640, 214], [710, 162], [790, 116], [862, 90], [900, 88], [911, 98],
                [906, 128], [888, 188], [860, 258], [830, 320], [806, 368], [770, 378], [700, 383], [630, 376],
                [575, 362], [535, 342], [512, 322]];
  const HIND = [[515, 330], [575, 352], [660, 372], [760, 385], [818, 396], [822, 410], [800, 440], [760, 482],
                [722, 524], [694, 574], [682, 632], [690, 700], [716, 768], [752, 818], [790, 850], [812, 866],
                [808, 876], [790, 874], [762, 858], [724, 812], [676, 740], [630, 660], [590, 590], [556, 520],
                [532, 470], [520, 420], [516, 372]];
  const COSTA = [[488, 296], [510, 294], [545, 286], [590, 256], [644, 210], [712, 160], [790, 114], [860, 89], [900, 86]];
  const FVEINS = [                                        // forewing: from cell to margin
    [[640, 232], [740, 160], [846, 102]], [[660, 232], [780, 160], [896, 104]], [[668, 236], [790, 190], [900, 150]],
    [[670, 246], [780, 230], [880, 210]], [[668, 258], [770, 270], [860, 268]], [[660, 268], [750, 300], [836, 322]],
    [[630, 282], [720, 320], [812, 360]], [[580, 300], [680, 340], [790, 374]], [[530, 322], [640, 356], [760, 380]],
  ];
  const FCELL = [[512, 300], [580, 272], [640, 236], [668, 246], [665, 262], [620, 284], [540, 316]];
  const HVEINS = [                                        // hindwing: from cell to margin, two into the tail
    [[600, 400], [700, 392], [812, 400]], [[640, 440], [720, 430], [800, 440]], [[652, 470], [700, 480], [752, 500]],
    [[650, 490], [690, 540], [700, 590]], [[640, 500], [690, 640], [760, 820], [800, 866]],
    [[620, 500], [650, 610], [700, 730], [770, 850]], [[560, 440], [590, 560], [640, 680]],
  ];
  const EYE_F = { x: 668, y: 232, rx: 14, ry: 17, a: -0.35 }, EYE_H = { x: 643, y: 453, rx: 19, ry: 19, a: 0.4 };

  const smoothClosed = pts => polyPath(curve(pts, true, 14), true);
  const halves = [];
  for (const sd of [1, -1]) {
    const tw = sd > 0 ? 0 : 0.012;                        // the left pair set a touch lower
    const fore = side(FORE, sd, tw), hind = side(HIND, sd, tw * 1.6);
    const fv = FVEINS.map(v => curve(side(v, sd, tw), false, 16));
    const hv = HVEINS.map(v => curve(side(v, sd, tw * 1.6), false, 16));
    const cell = side(FCELL, sd, tw);
    const eye = (e, a) => { const [x, y] = side([[e.x, e.y]], sd, a)[0]; return { x, y, rx: e.rx * S, ry: e.ry * S, a: e.a * sd }; };
    halves.push({ sd, fore: smoothClosed(fore), hind: smoothClosed(hind), forePts: curve(fore, true, 14), hindPts: curve(hind, true, 14),
                  fv, hv, cell: smoothClosed(cell), eyeF: eye(EYE_F, tw), eyeH: eye(EYE_H, tw * 1.6),
                  costa: curve(side(COSTA, sd, tw), false, 12), stalk: side([[655, 204], [662, 216]], sd, tw) });
  }
  // interpolated scale rows between adjacent veins (resampled to equal counts)
  const resample = (pts, n) => {
    const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const out = [], T = d[d.length - 1]; let j = 0;
    for (let i = 0; i < n; i++) { const s = T * i / (n - 1); while (j < d.length - 2 && d[j + 1] < s) j++; const u = (s - d[j]) / ((d[j + 1] - d[j]) || 1); out.push([lerp(pts[j][0], pts[j + 1][0], u), lerp(pts[j][1], pts[j + 1][1], u)]); }
    return out;
  };
  function rows(veins, per) {
    const out = [];
    for (let v = 0; v < veins.length - 1; v++) {
      const a = resample(veins[v], 40), b = resample(veins[v + 1], 40);
      for (let k = 1; k <= per; k++) { const u = k / (per + 1); out.push(a.map((p, i) => [lerp(p[0], b[i][0], u), lerp(p[1], b[i][1], u)])); }
    }
    return out;
  }
  for (const h of halves) { h.frows = rows(h.fv, 7); h.hrows = rows(h.hv, 7); }

  // body
  const body = {
    head: cut(ringPts(540, OY + 283 * S, 15, 13, 12), rngFor('luna:head'), { amp: 0.6 }),
    collar: cut(ringPts(540, OY + 296 * S, 30, 9, 14), rngFor('luna:collar'), { amp: 1 }),
    thorax: cut(ringPts(540, OY + 330 * S, 30, 40, 18), rngFor('luna:thorax'), { amp: 2.2 }),
    abdomen: cut([[540 - 24, OY + 362 * S], [540, OY + 356 * S], [540 + 24, OY + 362 * S], [540 + 26, OY + 400 * S], [540 + 18, OY + 445 * S],
                  [540 + 8, OY + 478 * S], [540, OY + 484 * S], [540 - 8, OY + 478 * S], [540 - 18, OY + 445 * S], [540 - 26, OY + 400 * S]],
                 rngFor('luna:abd'), { amp: 1.6 }),
  };
  // antennae: a curved shaft with paired pectinations shortening toward the tip
  const antennae = [];
  for (const sd of [1, -1]) {
    const shaft = curve([[540 + sd * 6, OY + 272 * S], [540 + sd * 20, OY + 246 * S], [540 + sd * 42, OY + 214 * S], [540 + sd * 58, OY + 196 * S]], false, 20);
    const branches = [];
    const n = shaft.length;
    for (let i = 2; i < n - 1; i += 2) {
      const [x, y] = shaft[i], [x1, y1] = shaft[Math.min(n - 1, i + 1)], m = Math.hypot(x1 - x, y1 - y) || 1;
      const tx = (x1 - x) / m, ty = (y1 - y) / m, t = i / (n - 1), len = 13 * Math.sin(Math.PI * Math.pow(t, 0.7)) + 2;
      for (const s of [1, -1]) {
        const ex = x + (-ty * s * 0.9 + tx * 0.55) * len, ey = y + (tx * s * 0.9 + ty * 0.55) * len;
        branches.push(nib([[x, y], [ex, ey]], u => 0.45 * (1 - u) + 0.12, { raw: true }));
      }
    }
    antennae.push({ shaft: nib(shaft, u => 1.3 * (1 - u) + 0.35, { raw: true }), branches });
  }

  /* Fig. 2 — the right hindwing eyespot at ×8, as the scales that make it.
     Scales are shingles in rows running across the wing, drawn back to front so
     each row laps the one behind. A scale's colour is the eyespot's colour at the
     scale's socket, mapped back to wing coordinates. */
  const eyeH = halves[0].eyeH, IC = [540, 800], IR = 118, MAG = 4.2;
  const scales = [], sr = rngFor('luna:scales');
  const colourAt = (wx, wy) => {                     // the same eyespot the wing prints, in its own frame
    const c = Math.cos(-eyeH.a), s = Math.sin(-eyeH.a), dx = wx - eyeH.x, dy = wy - eyeH.y;
    const lx = (dx * c - dy * s) / eyeH.rx, ly = (dx * s + dy * c) / eyeH.ry, rho = Math.hypot(lx, ly);
    if (rho > 1.05) return 'wing';
    if (rho > 0.95) return 'rim';
    if (rho > 0.78) return 'yolk';
    const inSh = k => Math.hypot(lx / 0.9, (ly - 0.5 * k) / 0.9) < 1;   // sh(k): the offset ellipses that cut the lunes
    if (!inSh(1.05)) return 'dark';
    if (!inSh(1.5)) return 'window';
    return 'yolk';
  };
  const rowDir = eyeH.a + 0.5;                        // scale rows run across the wing's flow
  for (let j = -24; j <= 24; j++) for (let i = -20; i <= 20; i++) {

/* ── IV. Agate, cut and polished ──────────────────────────────────────────────
   A nodule sawn through its middle. An agate records its own filling: silica
   gel lined the cavity wall layer by layer (bands at a fixed distance from the
   wall; where the wall turns sharply, those distances fold into the angular
   "fortification" creases), then settled flat at the bottom under gravity (the
   level onyx floor, which says which way was down), then lined again over wall
   and floor alike, and finally left a hollow that grew quartz crystals. Each
   stage is a Euclidean distance field computed exactly on the device raster;
   bands are a stochastic sequence laid along it. */

/** Exact squared Euclidean distance transform (Felzenszwalb–Huttenlocher), in px. */
function edt(inside, w, h) {
  const INF = 1e20, f = new Float64Array(Math.max(w, h)), d = new Float64Array(Math.max(w, h));
  const v = new Int32Array(Math.max(w, h)), z = new Float64Array(Math.max(w, h) + 1), out = new Float32Array(w * h);
  function pass(n) {
    let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1; q < n; q++) {
      let s;
      while (true) { const p = v[k]; s = ((f[q] + q * q) - (f[p] + p * p)) / (2 * q - 2 * p); if (s <= z[k]) { k--; if (k < 0) { k = 0; break; } } else break; }
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; const p = v[k]; d[q] = (q - p) * (q - p) + f[p]; }
  }
  for (let x = 0; x < w; x++) {                        // columns
    for (let y = 0; y < h; y++) f[y] = inside[y * w + x] ? INF : 0;
    pass(h); for (let y = 0; y < h; y++) out[y * w + x] = d[y];
  }
  for (let y = 0; y < h; y++) {                        // rows
    for (let x = 0; x < w; x++) f[x] = out[y * w + x];
    pass(w); for (let x = 0; x < w; x++) out[y * w + x] = Math.sqrt(d[x]);
  }
  return out;
}

    const i = Math.round(y * K) * OUT + Math.round(x * K);

    const depth = d2[i] - D2, gx = g2(x + 1, y) - g2(x - 1, y), gy = g2(x, y + 1) - g2(x, y - 1), gm = Math.hypot(gx, gy) || 1;
    const size = 2.6 + depth * 0.22 + cr() * 3.2;
    crystals.push({ x, y, dx: gx / gm, dy: gy / gm, size, depth, spin: (cr() - 0.5) * 1.8, v: cr() });
  }
  crystals.sort((a, b) => a.depth - b.depth);            // outer crystals first; inner ones grew over them
  for (const q of crystals) {
    const a = Math.atan2(q.dy, q.dx) + q.spin * 0.4, L = q.size * 1.25, Wd = q.size * 0.62;
    const T = (u, v) => [q.x + u * Math.cos(a) - v * Math.sin(a), q.y + u * Math.sin(a) + v * Math.cos(a)];
    const apex = T(L, q.spin * Wd * 0.3), b0 = T(0, -Wd), b1 = T(-0.15 * L, -0.25 * Wd), b2 = T(-0.1 * L, 0.35 * Wd), b3 = T(0, Wd);
    q.faces = [polyPath([b0, b1, apex], true), polyPath([b1, b2, apex], true), polyPath([b2, b3, apex], true)];
    q.body = polyPath([b0, b1, b2, b3, apex], true);
    // which face catches the light from the upper left
    const nrm = f => { const [p, r2] = [[b0, b1], [b1, b2], [b2, b3]][f]; const ex = r2[0] - p[0], ey = r2[1] - p[1]; return -ey * -0.6 + ex * -0.8; };
    q.lit = [0, 1, 2].map(f => clamp(0.5 + 0.5 * nrm(f) / (Math.hypot(...[[b0, b1], [b1, b2], [b2, b3]][f].reduce((s, p, k) => k ? [p[0] - s[0], p[1] - s[1]] : p, 0)) || 1), 0, 1));
  }
  return { outline, F, crystals };
});

scene('agate', {
  inks: ['blue', 'orange', 'pink'],
  plates(g, ink) {
    const A = agate();
    stamp(g, A.F[ink], A.outline);
    for (const q of A.crystals) {
      carve(g, q.body);
      q.faces.forEach((f, k) => {
        const lit = q.lit[k], dark = 1 - lit;
        const am = smooth(4, 26, q.depth);                    // amethyst deepens toward the heart
        const sheen = smooth(0.3, 0.55, dark);                // lit facets fall to bare paper: quartz sparkles
        const t = { blue: sheen * (0.2 + 0.6 * dark ** 1.4 + 0.15 * am), orange: 0.1 * dark * sheen,
                    pink: sheen * (0.1 + 0.12 * dark + 0.45 * am * (0.6 + 0.4 * q.v)) }[ink];
        print(g, f, t);
      });
      if (ink === 'blue') keyline(g, q.body, 0.3, 1);
    }
    if (ink === 'blue') keyline(g, A.outline, 0.9, 1);
  },
});

/* ── V. Sunflower, late August ────────────────────────────────────────────────
   Helianthus annuus, face on, at the week it is all three things at once: the
   rim already set seed, a ring of florets open and shedding pollen, the centre
   still in bud. Florets sit on Vogel's model of the capitulum, r = c√n,
   θ = n·137.508°, so the 34 and 55 parastichies appear by themselves. A bird has
   worked one flank of the seed ring; its sockets and chaff show. Inks: yellow
   and orange for flower and pollen; indigo for seed, bud-shade and line. */

const sunflower = memo(() => {
  const C = [536, 552], RD = 250, N = 1300, GA = Math.PI * (3 - Math.sqrt(5));
  const c = RD / Math.sqrt(N), rng = rngFor('sun:florets');
  const florets = [];
  for (let n = 0; n < N; n++) {
    const r = c * Math.sqrt(n + 0.5), th = n * GA + 0.3, rho = r / RD;
    const x = C[0] + r * Math.cos(th), y = C[1] + r * Math.sin(th);
    const zj = 0.035 * noise1(th * 3 + 7, 3) + (rng() - 0.5) * 0.03;
    const zone = rho + zj > 0.8 ? 'seed' : rho + zj > 0.6 ? 'open' : 'bud';
    // the bird's feeding ground: a crescent of the seed ring on the lower right
    const dth = Math.atan2(Math.sin(th - 0.75), Math.cos(th - 0.75));
    const pecked = zone === 'seed' && Math.abs(dth) < 0.62 + 0.15 * noise1(rho * 9, 5) && rng() < 0.93 - 0.5 * smooth(0.4, 0.62, Math.abs(dth));
    florets.push({ n, x, y, r, th, rho, zone, pecked, v: rng(), s: c * 1.77 });
  }
  // a floret's own cell: a rounded lozenge aligned to the radius, scaled to local spacing
  const lozenge = (f, k, len, wid) => {
    const a = f.th, ca = Math.cos(a), sa = Math.sin(a), s = f.s * k;
    const T = (u, v) => [f.x + u * ca - v * sa, f.y + u * sa + v * ca];
    return polyPath(curve([T(len * s / 2, 0), T(0.1 * s, wid * s / 2), T(-len * s / 2, 0), T(0.1 * s, -wid * s / 2)], true, 6), true);
  };
  for (const f of florets) {
    f.cell = lozenge(f, 0.9, 1.12, 0.92);
    if (f.zone === 'seed') {
      const a = f.th, ca = Math.cos(a), sa = Math.sin(a), s = f.s;
      f.stripes = [-0.2, 0.02, 0.22].map(v => polyPath([[f.x - 0.36 * s * ca - v * s * sa, f.y - 0.36 * s * sa + v * s * ca], [f.x + 0.4 * s * ca - v * 0.7 * s * sa, f.y + 0.4 * s * sa + v * 0.7 * s * ca]]));
      f.glint = cut(ringPts(f.x - 0.16 * s, f.y - 0.2 * s, 0.13 * s, 0.09 * s, 8, -0.7), rngFor('sg' + f.n), { amp: 0.2 });
      if (f.pecked) { f.socket = lozenge(f, 0.62, 1.1, 0.8); f.chaff = lozenge(f, 0.95, 1.2, 0.28); }
    } else if (f.zone === 'open') {
      // a five-lobed corolla seen from above, anther tube dark, stigma lobes curling
      const pts = [], s = f.s * 0.6, rot = f.v * TAU;
      for (let k = 0; k < 10; k++) { const a = rot + k / 10 * TAU, rr = k % 2 ? s * 0.55 : s; pts.push([f.x + Math.cos(a) * rr, f.y + Math.sin(a) * rr]); }
      f.corolla = polyPath(curve(pts, true, 3), true);
      f.tube = cut(ringPts(f.x, f.y, s * 0.27, s * 0.27, 8), rngFor('st' + f.n), { amp: 0.15 });
      f.stigma = nib([[f.x, f.y], [f.x + Math.cos(rot) * s * 0.5, f.y + Math.sin(rot) * s * 0.5], [f.x + Math.cos(rot + 0.9) * s * 0.62, f.y + Math.sin(rot + 0.9) * s * 0.62]], u => 0.5 * (1 - u) + 0.15, { per: 5 });
    } else {
      f.bud = lozenge(f, 0.96, 1.05, 0.95);
      const a = f.th, s = f.s * 0.42;
      f.ridge = polyPath([[f.x - Math.cos(a) * s, f.y - Math.sin(a) * s], [f.x + Math.cos(a) * s, f.y + Math.sin(a) * s]]);
    }
  }
  const disc = cut(ringPts(C[0], C[1], RD + 7, RD + 7, 48), rngFor('sun:disc'), { amp: 1.5 });

  // ray florets: two whorls of 17, curled, drooping, a few folded at the tip
  const pr = rngFor('sun:petals'), petals = [];
  for (let w = 0; w < 2; w++) for (let k = 0; k < 17; k++) {
    const phi = (k + (w ? 0.5 : 0)) / 17 * TAU + 0.12 + (pr() - 0.5) * 0.12;
    const droop = pr(), L = (w ? 170 : 186) * (0.78 + 0.26 * pr()) * (droop < 0.15 ? 0.72 : 1), Wd = (w ? 64 : 58) * (0.88 + 0.24 * pr());
    const bend = (pr() - 0.5) * 0.35, fold = pr() < 0.28 ? (pr() < 0.5 ? 1 : -1) : 0;
    const base = [C[0] + Math.cos(phi) * (RD - 14), C[1] + Math.sin(phi) * (RD - 14)];
    const ca = Math.cos(phi), sa = Math.sin(phi);
    const T = (u, v) => { const x = u * L, y = v + bend * u * u * L; return [base[0] + x * ca - y * sa, base[1] + x * sa + y * ca]; };
    const hw = u => Wd / 2 * Math.pow(Math.sin(Math.PI * Math.min(1, Math.pow(u, 1.25))), 0.55) * (1 - 0.1 * u) + 2.5 * (1 - u);
    const left = [], right = [];
    for (let i = 0; i <= 30; i++) { const u = i / 30; left.push(T(u, -hw(u))); right.push(T(u, hw(u))); }
    const tip = T(1.06, 0);
    const outline = polyPath(left.concat([tip], right.reverse()), true);
    const veins = [];
    for (let v = -3; v <= 3; v++) {
      const vp = []; for (let i = 1; i <= 26; i++) { const u = 0.04 + 0.92 * i / 26; vp.push(T(u, hw(u) * v / 3.6)); }
      veins.push(nib(vp, u => 0.34 * (1 - 0.7 * u), { raw: true }));
    }
    let foldPath = null;
    if (fold) {                                        // the tip turned over, its paler back showing
      const u0 = 0.72, pts = [T(u0, -hw(u0) * fold), T(1.03, 0)];
      for (let i = 0; i <= 8; i++) { const u = u0 + (1 - u0) * i / 8; pts.push(T(u, hw(u) * fold * 0.2 + fold * 3)); }
      foldPath = polyPath(pts, true);
    }
    petals.push({ w, phi, outline, veins, foldPath, T, hw, L });
  }
  // phyllaries: green bract tips between the ray bases
  const bracts = [];
  for (let k = 0; k < 26; k++) {
    const phi = k / 26 * TAU + 0.3 + (pr() - 0.5) * 0.1, L = 70 + pr() * 30, Wd = 26;
    const ca = Math.cos(phi), sa = Math.sin(phi), b0 = RD + 8;
    const T = (u, v) => [C[0] + (b0 + u * L) * ca - v * sa, C[1] + (b0 + u * L) * sa + v * ca];
    const tw = (pr() - 0.5) * 0.5;
    bracts.push(polyPath(curve([T(-0.1, -Wd / 2), T(0.5, -Wd * 0.42), T(1, tw * 10), T(1.02, tw * 10), T(0.5, Wd * 0.42), T(-0.1, Wd / 2)], true, 6), true));
  }
  return { C, RD, florets, disc, petals, bracts };
});

scene('sunflower', {
  inks: ['yellow', 'orange', 'indigo'],
  plates(g, ink) {
    const S = sunflower(), [cx, cy] = S.C;
    // bracts behind everything
    for (const b of S.bracts) {
      plane(g, b, { yellow: 0.62, orange: 0.08, indigo: 0.42 }[ink]);
      if (ink === 'indigo') keyline(g, b, 0.5, 1);
    }
    // petals, back whorl then front
    for (const w of [1, 0]) for (const p of S.petals.filter(q => q.w === w)) {
      carve(g, p.outline);
      if (ink === 'yellow') print(g, p.outline, 1);
      if (ink === 'orange') {
        print(g, p.outline, w ? 0.22 : 0.07);
        // the base sits in the disc's shadow
        g.save(); g.clip(p.outline);
        shade(g, null, { x: cx, y: cy, r0: S.RD - 10, r: S.RD + 90, stops: [[0, 0.7], [0.5, 0.25], [1, 0]] });
        g.restore();
        for (const v of p.veins) print(g, v, 1);
      }
      if (ink === 'indigo') {
        g.save(); g.clip(p.outline);
        shade(g, null, { x: cx, y: cy, r0: S.RD - 10, r: S.RD + 60, stops: [[0, 0.45], [1, 0]] });
        if (w) print(g, p.outline, 0.08);
        g.restore();
        keyline(g, p.outline, 0.4, 1);
      }
      if (p.foldPath) {
        carve(g, p.foldPath);
        if (ink === 'yellow') print(g, p.foldPath, 0.6);
        if (ink === 'orange') print(g, p.foldPath, 0.22);
        if (ink === 'indigo') { print(g, p.foldPath, 0.12); keyline(g, p.foldPath, 0.5, 1); }
      }
    }
    // the disc: receptacle ground, then every floret in its state
    carve(g, S.disc);                                     // the receptacle between florets: near black
    if (ink === 'orange') print(g, S.disc, 0.75);
    if (ink === 'indigo') print(g, S.disc, 0.95);
    if (ink === 'yellow') print(g, S.disc, 0.3);
    /* Florets are ~20 px: below the screen's resolving power, so they print in
       solid overprints and take their modelling from shape, not dot size. */
    const half = (f, k) => {                               // the half of a floret turned from the light
      const a = -2.3, ca = Math.cos(a), sa = Math.sin(a), s = f.s * k, p = new Path2D();
      p.moveTo(f.x - sa * s, f.y + ca * s); p.lineTo(f.x + sa * s, f.y - ca * s);
      p.lineTo(f.x + sa * s - ca * s, f.y - ca * s - sa * s); p.lineTo(f.x - sa * s - ca * s, f.y + ca * s - sa * s); p.closePath();
      return p;
    };
    for (const f of S.florets) {
      if (f.zone === 'seed') {
        if (f.pecked) {                                      // empty socket, chaff standing
          carve(g, f.cell);
          if (ink === 'yellow') print(g, f.cell, 0.22);
          if (ink === 'orange') print(g, f.cell, 0.12);
          carve(g, f.socket);
          if (ink === 'indigo' || ink === 'orange') print(g, f.socket, 1);
          if (ink === 'yellow') print(g, f.chaff, 1);
          if (ink === 'indigo') keyline(g, f.chaff, 0.3, 1);
          continue;
        }
        carve(g, f.cell);
        if (ink === 'indigo' || ink === 'orange') print(g, f.cell, 1);   // black achene
        g.save(); g.clip(f.cell); g.globalCompositeOperation = 'destination-out'; g.lineWidth = 0.7; g.globalAlpha = 1;
        for (const st of f.stripes) g.stroke(st);                // the achene's grey stripes, as ink removed
        g.restore();
        carve(g, f.glint);
      } else if (f.zone === 'open') {
        carve(g, f.corolla);
        if (ink === 'yellow') print(g, f.corolla, 1);
        if (ink === 'orange') { g.save(); g.clip(f.corolla); print(g, half(f, 0.62), 0.55); g.restore(); }
        carve(g, f.tube);
        if (ink === 'indigo' || ink === 'orange') print(g, f.tube, 1);
        carve(g, f.stigma);
        if (ink === 'yellow') print(g, f.stigma, 1);
      } else {
        carve(g, f.bud);
        if (ink === 'yellow') print(g, f.bud, 1);
        if (ink === 'indigo') { g.save(); g.clip(f.bud); print(g, half(f, 0.55), 1); g.restore(); }
        if (ink === 'orange' && f.rho > 0.45) print(g, f.bud, 0.9 * smooth(0.45, 0.6, f.rho));
      }
    }
    // the disc's dome: a soft shade on its lower right, the engraved rim
    if (ink === 'indigo') {
      g.save(); g.clip(S.disc);
      shade(g, null, { x0: cx - S.RD * 0.7, y0: cy - S.RD * 0.7, x1: cx + S.RD, y1: cy + S.RD, stops: [[0, 0], [0.55, 0], [1, 0.4]] });
      g.restore();
      keyline(g, S.disc, 0.8, 1);
    }
  },
});

const PRINTS = ['nautilus', 'diatoms', 'luna', 'agate', 'sunflower'];

/* Plate numbers: engraved roman capitals, thick and thin strokes as a burin cuts
   them, bracketed serifs. Printed on each plate's key ink so the number belongs
   to the impression. Only I and V are needed, both straight strokes. */
function numeral(n, cx, base, h) {
  const glyphs = [], romans = ['I', 'II', 'III', 'IV', 'V'][n - 1];
  const thick = h * 0.13, thin = h * 0.045, sw = h * 0.2;
  const adv = { I: h * 0.36, V: h * 0.78 }, total = [...romans].reduce((s, c) => s + adv[c], 0) + (romans.length - 1) * h * 0.1;
  let x = cx - total / 2;
  const stem = (x0, y0, x1, y1, w) => nib([[x0, y0], [x1, y1]], u => w * (1 + 0.25 * Math.pow(Math.abs(u - 0.5) * 2, 6)), { raw: true });
  const serif = (x0, y, len) => nib([[x0 - len, y], [x0 + len, y]], u => thin * (0.6 + 0.8 * Math.pow(Math.abs(u - 0.5) * 2, 3)), { raw: true });
  for (const c of romans) {
    if (c === 'I') {
      const m = x + adv.I / 2;
      glyphs.push(stem(m, base - h, m, base, thick / 2), serif(m, base - h + thin / 2, sw), serif(m, base - thin / 2, sw));
    } else {
      const l = x + h * 0.08, r = x + adv.V - h * 0.08, m = (l + r) / 2;
      glyphs.push(stem(l, base - h, m, base, thick / 2), stem(r, base - h, m, base, thin / 2),
                  serif(l, base - h + thin / 2, sw * 0.9), serif(r, base - h + thin / 2, sw * 0.7));
    }
    x += adv[c] + h * 0.1;
  }
  return glyphs;
}
const KEY_INK = { nautilus: 'indigo', diatoms: 'indigo', luna: 'violet', agate: 'blue', sunflower: 'indigo' };
PRINTS.forEach((id, i) => {
  const sc = SCENES[id], inner = sc.plates, glyphs = numeral(i + 1, 540, 1058, 19);
  sc.plates = (g, ink, rng, sr) => {
    inner(g, ink, rng, sr);
    if (ink === KEY_INK[id]) { g.save(); g.setTransform(K, 0, 0, K, 0, 0); for (const p of glyphs) print(g, p, 1); g.restore(); }
  };
});
function drawArt(t) { paintBaked(PRINTS[clamp(Math.floor(t + 1e-6), 0, PRINTS.length - 1)]); }
const SHOTS=[]; // Optional review data: {id,start,end,readAt,action,transition}.
// ART END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=canvas.height=OUT;
paper=bakePaper();
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time');
function render(t) {
  t=clamp(t,0,DUR); ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paper,0,0);drawArt(t);scrub.value=t;clockLabel.value=t.toFixed(2);
}
function paintBaked(id) {
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(bakeScene(id,OUT),0,0);ctx.restore();
}
/* A frame slower than the frame interval cannot play live (live-plate films take
   100-200 ms): Play then renders every frame once into a WebP cache, shown as
   "Buffering n%", and plays from it at FPS; replays are immediate. Fast films play
   live. seek() and window.__riso stay live and pure; tools never touch the cache. */
const FPS=30,NF=Math.round(DUR*FPS),cache=[],bitmaps=new Map(),playBtn=document.getElementById('play');
let at=0,playing=false,epoch=0,recorder=null,recordURL=null,slow=null,buffering=false,filled=0;
function label(){playBtn.textContent=playing?'Pause':buffering?'Buffering '+Math.round(filled/(NF+1)*100)+'%':'Play';}
function start(){if(at>=DUR)at=0;epoch=performance.now()-at*1000;playing=true;label();}
function pause(){if(playing)at=clamp((performance.now()-epoch)/1000,0,DUR);playing=false;buffering=false;label();if(recorder?.state==='recording')recorder.stop();}
async function buffer(){
  buffering=true;label();const resume=at;
  for(let i=0;i<=NF&&buffering;i++){
    if(cache[i])continue;
    render(i/FPS);canvas.toBlob(b=>{cache[i]=b;filled++;},'image/webp',0.8);   // snapshots now, encodes alongside the next draw
    label();await new Promise(r=>setTimeout(r,0));
  }
  while(buffering&&filled<NF+1)await new Promise(r=>setTimeout(r,50));
  if(buffering){buffering=false;at=resume;start();}
}
function play(){
  if(at>=DUR)at=0;
  if(slow===null){const t0=performance.now();render(at);render(at);slow=(performance.now()-t0)/2>900/FPS;}
  if(!slow||filled>=NF+1)start();else buffer();
}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
playBtn.onclick=()=>playing||buffering?pause():play();
document.getElementById('replay').onclick=()=>{seek(0);play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing||buffering?pause():play();if(e.code==='ArrowLeft')seek(at-1/FPS);if(e.code==='ArrowRight')seek(at+1/FPS);});
document.getElementById('record').onclick=()=>{
  if(recorder?.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(FPS),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.getElementById('download');a.href=recordURL;a.download='preview.webm';a.style.display='inline';};
  recorder.start();play();
};
function tick(now){
  if(playing){
    at=clamp((now-epoch)/1000,0,DUR);
    if(!slow)render(at);
    else{
      const i=Math.min(NF,Math.floor(at*FPS));
      for(let j=i;j<Math.min(NF+1,i+8);j++)if(cache[j]&&!bitmaps.has(j)){bitmaps.set(j,null);createImageBitmap(cache[j]).then(b=>bitmaps.set(j,b));}
      for(const [j,b] of bitmaps)if(j<i-1){if(b)b.close();bitmaps.delete(j);}
      const b=bitmaps.get(i);
      if(b){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);scrub.value=at;clockLabel.value=at.toFixed(2);}
    }
    if(at>=DUR)pause();
  }
  requestAnimationFrame(tick);
}
window.__riso={duration:DUR,ready:false,seek,shots:SHOTS};  // plates bake lazily on first seek; seek stays pure
seek(Number(new URLSearchParams(location.search).get('t'))||0);
document.querySelector('nav').hidden=true;
window.__riso.ready=true;
