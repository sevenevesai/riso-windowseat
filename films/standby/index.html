<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
const CSS=720, W=1080, OUT=1080, K=1, PITCH=4.6, DUR=52;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d');
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.
 * Next to the screen it reads as engraving, and it is how a mid-value stops
 * being flat without adding another ink.

/* ── the room, per pixel ──────────────────────────────────────────────────────
   One ray per device pixel finds the first surface; its coverage on each plate
   is the material's unlit value, cut by the light that reaches it (relight)
   and inked in that light's colour. Light comes from the logo and the dark
   screen's glow, from the street lamp through the blinds, and from the
   passing car. Values go straight into each plate's alpha; vector details
   are drawn on top.                                                         */
const BASE = PL.map(() => new ImageData(W, W));
const COV = new Float32Array(NP);
const HIT = { s: 0, ax: 0 };
/* Nearest box hit along o + s·d for s in (1e-3, smax): index or −1; the entry
   parameter and face axis go to HIT. */
function nearestBox(ox, oy, oz, dx, dy, dz, smax, skip = -1) {
  let best = smax, bi = -1, bax = 0;
  const ix = 1 / dx, iy = 1 / dy, iz = 1 / dz;
  for (let i = 0, n = BOXES.length; i < n; i++) {
    if (i === skip) continue;
    const k = i * 6;
    let a = (BOXF[k] - ox) * ix, c = (BOXF[k + 1] - ox) * ix;
    if (a > c) { const s = a; a = c; c = s; }
    let t0 = a, t1 = c, ax = 0;
    a = (BOXF[k + 2] - oy) * iy; c = (BOXF[k + 3] - oy) * iy;
    if (a > c) { const s = a; a = c; c = s; }
    if (a > t0) { t0 = a; ax = 1; }
    if (c < t1) t1 = c;
    if (t0 > t1) continue;
    a = (BOXF[k + 4] - oz) * iz; c = (BOXF[k + 5] - oz) * iz;
    if (a > c) { const s = a; a = c; c = s; }
    if (a > t0) { t0 = a; ax = 2; }
    if (c < t1) t1 = c;
    if (t0 > t1 || t0 < 1e-3 || t0 >= best) continue;
    best = t0; bi = i; bax = ax;
  }
  HIT.s = best; HIT.ax = bax;
  return bi;
}

/* Lit fraction toward a lamp at L (radius R) through the window and slats:
   the slat edges blur by the lamp's footprint in the window plane. */
function blinds(px, py, pz, L, R) {
  const vx = L[0] - px, vy = L[1] - py, vz = L[2] - pz;
  if (vx >= 0) return 0;
  const s = (WIN.x - px) / vx;
  if (s <= 0 || s >= 1) return 0;
  const wy = py + vy * s, wz = pz + vz * s;
  const pen = Math.max(0.12, R * s / (1 - s));                 // blur, cm in the window plane
  if (wy < WIN.y0 - pen || wy > WIN.y1 + pen || wz < WIN.z0 - pen || wz > WIN.z1 + pen) return 0;
  const inY = sm((wy - WIN.y0) / pen + 0.5) * sm((WIN.y1 - wy) / pen + 0.5);
  const inZ = sm((wz - WIN.z0) / pen + 0.5) * sm((WIN.z1 - wz) / pen + 0.5);
  const ph = fract((wy - WIN.y0) / WIN.pitch), pw = pen / WIN.pitch;
  const slat = sm(ph / pw + 0.5) * sm((WIN.open - ph) / pw + 0.5) + sm((ph - 1) / pw + 0.5);
  if (slat * inY * inZ <= 0.002) return 0;
  if (nearestBox(px, py, pz, vx, vy, vz, s) >= 0) return 0;
  return inY * inZ * clamp(slat, 0, 1);
}

/* A 90s wallpaper border round the room at picture-rail height: a paler band
   with rules, a zigzag and dots. In the dark it barely shows; the blind
   stripes and the headlights reveal it. Returns the factor on the dark plates. */
const BORDER = { y0: 157, y1: 172, period: 13 };
function borderInk(x, y) {
  const { y0, y1, period } = BORDER, mid = (y0 + y1) / 2, u = fract(x / period);
  if (y - y0 < 0.9 || y1 - y < 0.9) return 1.12;                         // rules
  const zig = mid + 3.6 * (Math.abs(u - 0.5) * 4 - 1);
  if (Math.abs(y - zig) < 0.62) return 1.14;                             // the zigzag
  const dy = y - (u < 0.5 ? mid + 3.4 : mid - 3.4), dx = (u - (u < 0.5 ? 0.25 : 0.75)) * period;
  if (dx * dx + dy * dy < 0.72) return 1.12;                             // dots in the zigzag's bays
  return 0.9;
}

/* This frame's lights, set by drawArt before renderRoom. */
const LIGHT = { ink: 'pink', logo: null, glow: 0, lamp: 1, car: null, bloom: null, lip: 0, amb: 0, dead: 0 };
const hash2 = (a, b) => { let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) & 1023) / 511.5 - 1; };

function renderRoom() {
  const f = CAM.focal, F = CAM.fwd, R = CAM.right, V = CAM.up, [ex, ey, ez] = CAM.eye;
  const D = BASE.map(b => b.data), inkI = PLI[LIGHT.ink];
  const lg = LIGHT.logo, glow = LIGHT.glow, bl = LIGHT.bloom, car = LIGHT.car, lamp = LIGHT.lamp;
  const iO = PLI.orange, iY = PLI.yellow, iI = PLI.indigo, iB = PLI.blue, iV = PLI.violet;
  const tvF = BOXI.tvFront, su = PIC.w / (SCR.x1 - SCR.x0), sv = PIC.h / (SCR.y1 - SCR.y0);
  for (let py = 0; py < W; py++) {
    const sy = -(py + 0.5 - 540) / f;
    for (let px = 0; px < W; px++) {
      const sx = (px + 0.5 - 540) / f;
      const dx = F[0] + R[0] * sx + V[0] * sy, dy = F[1] + R[1] * sx + V[1] * sy, dz = F[2] + R[2] * sx + V[2] * sy;
      let s = Infinity, ax = 0, sg = 0, mat;
      if (dx > 0) { const q = (ROOM[1] - ex) / dx; if (q < s) { s = q; ax = 0; sg = -1; } }
      else if (dx < 0) { const q = (ROOM[0] - ex) / dx; if (q < s) { s = q; ax = 0; sg = 1; } }
      if (dy > 0) { const q = (ROOM[3] - ey) / dy; if (q < s) { s = q; ax = 1; sg = -1; } }
      else if (dy < 0) { const q = (ROOM[2] - ey) / dy; if (q < s) { s = q; ax = 1; sg = 1; } }
      if (dz > 0) { const q = (ROOM[5] - ez) / dz; if (q < s) { s = q; ax = 2; sg = -1; } }
      else if (dz < 0) { const q = (ROOM[4] - ez) / dz; if (q < s) { s = q; ax = 2; sg = 1; } }
      mat = ax === 1 ? (sg > 0 ? MATI.carpet : MATI.ceiling) : ax === 0 ? MATI.side : MATI.wall;
      let bi = nearestBox(ex, ey, ez, dx, dy, dz, s);
      if (bi === BOXI.tvFront && HIT.ax === 2) {
        const hx = Math.abs(ex + dx * HIT.s), hy = ey + dy * HIT.s, cx = Math.min(hx, TVF[1] - TV_R), cy = clamp(hy, TVF[2] + TV_R, TVF[3] - TV_R);
        if ((hx - cx) ** 2 + (hy - cy) ** 2 > TV_R * TV_R) bi = nearestBox(ex, ey, ez, dx, dy, dz, s, BOXI.tvFront);
      }
      if (bi >= 0) {
        s = HIT.s; ax = HIT.ax; sg = (ax === 0 ? dx : ax === 1 ? dy : dz) > 0 ? -1 : 1;
        mat = EDGEB[bi] && ax === 2 && sg > 0 ? MATI.edge : BOXM[bi];
      }
      const Px = ex + dx * s, Py = ey + dy * s, Pz = ez + dz * s;
      const nx = ax === 0 ? sg : 0, ny = ax === 1 ? sg : 0, nz = ax === 2 ? sg : 0;
      // glass and the bezel's lip inside the TV's opening
      let glassB = -1, lip = 0, sheen = 0;
      if (bi === tvF && nz > 0) {
        const u = (Px - SCR.x0) * su, v = (SCR.y1 - Py) * sv;
        if (inPicture(u, v)) {
          mat = MATI.glass;
          // the convex glass mirrors the window: a broad pale sheen, upper left
          sheen = 0.22 * Math.exp(-((u - 150) ** 2) / 46000 - ((v - 120) ** 2) / 30000);
          if (bl) {
            const qx = Math.max(Math.abs(u - bl.u) - bl.hw, 0), qy = Math.max(Math.abs(v - bl.v) - bl.hh, 0);
            glassB = Math.exp(-(qx * qx + qy * qy) / bl.s2) * bl.k;
          } else glassB = 0;
        } else if (inRound(u, v, 16)) {
          // the recess round the tube: darker, and lit by the logo when it comes close
          mat = MATI.recess;
          if (bl) {
            // distance from the logo's own box, so a near miss lights the lip it nearly touches
            const qx = Math.max(Math.abs(u - bl.u) - LOGO.w / 2, 0), qy = Math.max(Math.abs(v - bl.v) - LOGO.h / 2, 0);
            lip = Math.min(1, Math.exp(-Math.sqrt(qx * qx + qy * qy) / 42) * LIGHT.lip * (inRound(u, v, 6) ? 1 : 0.6));
          }
        }
      }
      const mc = MCOV[mat], alb = MALB[mat];
      const fk = ny > 0 ? 0.92 : nx !== 0 ? 1.05 : 1;
      for (let k = 0; k < NP; k++) COV[k] = mc[k] * fk;
      if (mat === MATI.carpet) {
        const n = hash2(Math.floor(Px / 1.1), Math.floor(Pz / 1.1)) * 0.07 + hash2(Math.floor(Px / 7) + 999, Math.floor(Pz / 7)) * 0.05;
        COV[iI] *= 1 + n; COV[iB] *= 1 + n;
      }
      // inside the stand: under its top, out of the screen's light
      if (bi >= 0 && Px > -48.5 && Px < 48.5 && Py < 45.4 && Pz < 50.4) { COV[iI] = Math.min(1, COV[iI] * 1.3); COV[iB] = Math.min(1, COV[iB] * 1.35); COV[iV] = Math.min(1, COV[iV] * 1.4 + .06); }
      if (mat === MATI.wall && Py > BORDER.y0 && Py < BORDER.y1) {
        const k = borderInk(Px, Py);
        COV[iI] *= k; COV[iV] *= k; COV[iB] *= k;
      }
      const ox = Px + nx * 0.05, oy = Py + ny * 0.05, oz = Pz + nz * 0.05;
      // the logo and the screen's glow: emitted forward from the glass
      let es = 0, ea = 0;
      if (lg) {
        let vx = ox - lg[0], vy = oy - lg[1], vz = oz - lg[2], d2 = vx * vx + vy * vy + vz * vz, d = Math.sqrt(d2);
        let ce = vz / d, cr = -(nx * vx + ny * vy + nz * vz) / d;
        if (ce > 0 && cr > 0) es += lg[3] * ce * cr / d2;
        // light bounced round the room: no direction, falls off from the set
        if (mat !== MATI.glass) {
          const qx = ox, qy = oy - 80, qz = oz - 50, inStand = ox > -48.5 && ox < 48.5 && oy < 45.5 && oz < 50.5;
          ea = LIGHT.amb / (1 + (qx * qx + qy * qy + qz * qz) / 12100) * (inStand ? 0.22 : 1);
        }
        if (glow) {
          vx = ox; vy = oy - 80; vz = oz - 49.5; d2 = vx * vx + vy * vy + vz * vz; d = Math.sqrt(d2);
          ce = vz / d; cr = -(nx * vx + ny * vy + nz * vz) / d;
          if (ce > 0 && cr > 0) es += glow * ce * cr / d2;
        }
      }
      let eo = 0;
      if (lamp) {
        const vx = LAMP[0] - ox, vy = LAMP[1] - oy, vz = LAMP[2] - oz;
        const c = (nx * vx + ny * vy + nz * vz) / Math.sqrt(vx * vx + vy * vy + vz * vz);
        if (c > 0) eo = lamp * (0.35 + 0.65 * c) * blinds(ox, oy, oz, LAMP, LAMP_R);
      }
      let ec = 0;
      if (car) {
        const vx = car[0] - ox, vy = car[1] - oy, vz = car[2] - oz;
        const c = (nx * vx + ny * vy + nz * vz) / Math.sqrt(vx * vx + vy * vy + vz * vz);
        if (c > 0) ec = car[3] * (0.35 + 0.65 * c) * blinds(ox, oy, oz, car, car[4]);
      }

      const Ls = 1 - Math.exp(-alb * es), La = 1 - Math.exp(-alb * ea), Lo = alb * eo * 1.1, Lc = alb * ec * 1.1;
      const keep = (1 - 0.94 * Ls) * (1 - 0.75 * La) * (1 - 0.96 * Math.min(1, Lo)) * (1 - 0.96 * Math.min(1, Lc)) * (1 - 0.95 * lip);
      COV[iI] *= keep; COV[iB] *= keep; COV[iV] *= keep;
      COV[inkI] += 0.86 * Ls + 0.42 * La + 0.8 * lip;
      COV[iO] += 0.8 * Math.min(1, Lo);
      COV[iY] += 0.14 * Math.min(1, Lc);
      if (glassB >= 0) {
        // a dead tube is darker than a live one showing black
        const g = (1 - 0.8 * glassB) * (1 - sheen * (1 - 0.5 * LIGHT.dead)) * (1 + 0.16 * LIGHT.dead);
        COV[iI] *= g; COV[iB] *= g; COV[iV] *= g;
        COV[inkI] += 0.45 * Math.min(1, glassB);
      }
      const j = (py * W + px) * 4 + 3;
      for (let k = 0; k < NP; k++) D[k][j] = COV[k] * 255;
    }
  }
  // every frame starts from the same context state, whatever the last frame left
  for (let k = 0; k < NP; k++) {
    const g = PG[PL[k]];
    g.putImageData(BASE[k], 0, 0);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000'; g.lineCap = g.lineJoin = 'round';

}

/* ── the logo: an invented wordmark (italic caps on a flat ring) ─────────────
   Not the DVD Video mark: a made-up player brand in the era's space-age style. */
const LOGO_PATHS = (() => {
  const sl = 0.22;                                   // italic slant, x per unit of height
  const P = (pts) => pts.map(([x, y]) => [x + (14 - y) * sl, y]);
  const glyphs = {
    O: [P(ringPts(5, 7, 5, 7, 28, 0)), P(ringPts(5, 7, 2.2, 4.4, 24, 0)).reverse()],
    R: [P([[0, 0], [6.2, 0], [9, 1.6], [9.4, 4.2], [8, 6.4], [5.6, 7.4], [9.6, 14], [6.4, 14], [3.2, 8], [3, 8], [3, 14], [0, 14]]),
        P([[3, 2.6], [5.6, 2.6], [6.6, 3.6], [6.4, 4.8], [5.2, 5.6], [3, 5.6]]).reverse()],
    B: [P([[0, 0], [6.6, 0], [9, 1.4], [9.2, 3.6], [8, 5.6], [9.8, 7.4], [9.8, 10.6], [8, 13], [6, 14], [0, 14]]),
        P([[3, 2.5], [5.6, 2.5], [6.4, 3.4], [6.2, 4.8], [5.2, 5.6], [3, 5.6]]).reverse(),
        P([[3, 8.2], [6, 8.2], [7, 9.2], [6.8, 10.8], [5.8, 11.5], [3, 11.5]]).reverse()],
    I: [P([[0, 0], [3, 0], [3, 14], [0, 14]])],
    T: [P([[0, 0], [10, 0], [10, 2.8], [6.5, 2.8], [6.5, 14], [3.5, 14], [3.5, 2.8], [0, 2.8]])],
  };
  const adv = { O: 11.2, R: 10.6, B: 10.8, I: 4.6, T: 10.4 };
  const polys = [];
  let x = 0;
  for (const ch of 'ORBIT') { for (const p of glyphs[ch]) polys.push(p.map(([a, b]) => [a + x, b])); x += adv[ch]; }
  const k = 150 / (x + 14 * sl);
  const word = polys.map(p => p.map(([a, b]) => [5 + a * k, 6 + b * k]));
  const ring = [ringPts(80, 70, 74, 13, 64, 0), ringPts(80, 70.6, 54, 6.4, 64, 0).reverse()];
  return { word, ring };
})();

/* Screen-unit polygons → world on the glass → one screen path. */
function picPath(polys, ox, oy) {
  const p = new Path2D();
  for (const q of polys) {
    q.forEach(([a, b], i) => { const [x, y] = CAM.project(picW(ox + a, oy + b)); i ? p.lineTo(x, y) : p.moveTo(x, y); });
    p.closePath();
  }
  return p;
}
function wpath(pts) { const s = CAM.polygon(pts); return s.length >= 3 ? poly(s) : null; }
function wput(pts, cov, rule) { const p = wpath(pts); if (p) put(p, cov, rule); return p; }
const quadZ = (z, x0, y0, x1, y1) => [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]];

/* ── VFD clock: 12:00, blinking because nobody set it ────────────────────── */
const VFD = { x: -5.6, y: 25.25, z: 44.53, h: 2.55, w: 1.45, gap: 0.62 };
const SEGS = { // a b c d e f g on a unit digit (0..1 × 0..1, y down)
  a: [[0.1, 0], [0.9, 0]], b: [[1, 0.07], [1, 0.46]], c: [[1, 0.54], [1, 0.93]], d: [[0.1, 1], [0.9, 1]],
  e: [[0, 0.54], [0, 0.93]], f: [[0, 0.07], [0, 0.46]], g: [[0.1, 0.5], [0.9, 0.5]],
};
const DIGITS = { 1: 'bc', 2: 'abged', 0: 'abcdef' };
const vfdOn = t => fract(t) < 0.5;
function vfdPath() {
  const p = new Path2D(), sl = 0.12;
  let x = VFD.x;
  const seg = (a, b, w) => {
    const A = CAM.project([a[0], a[1], VFD.z]), B = CAM.project([b[0], b[1], VFD.z]);
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1, nx = -(B[1] - A[1]) / L * w / 2, ny = (B[0] - A[0]) / L * w / 2;
    p.moveTo(A[0] + nx, A[1] + ny); p.lineTo(B[0] + nx, B[1] + ny); p.lineTo(B[0] - nx, B[1] - ny); p.lineTo(A[0] - nx, A[1] - ny); p.closePath();
  };
  const k = CAM.focal / CAM.depth([0, VFD.y, VFD.z]), w = Math.max(2, 0.4 * k);
  const at = (dx, dy) => [x + dx * VFD.w + (1 - dy) * VFD.h * sl, VFD.y + VFD.h - dy * VFD.h];
  for (const ch of '12:00') {
    if (ch === ':') {
      for (const yy of [0.3, 0.72]) { const c = CAM.project([x + 0.12, VFD.y + VFD.h * (1 - yy), VFD.z]); p.moveTo(c[0] + w * 0.6, c[1]); p.arc(c[0], c[1], w * 0.6, 0, TAU); }
      x += 0.5; continue;
    }
    for (const sname of DIGITS[ch]) { const [a, b] = SEGS[sname]; seg(at(a[0], a[1]), at(b[0], b[1]), w); }
    x += VFD.w + VFD.gap;
  }
  return p;
}

/* ── vector details on the furniture ─────────────────────────────────────── */
function drawDetails(t) {
  const zt = TVF[5] + 0.02, zc = 44.52;
  // TV: control strip and buttons under the screen, a brand plate above it
  wput(quadZ(zt, -31, 52.4, 31, 56.8), { indigo: .9, blue: .74, violet: .26 });
  for (const x of [13.5, 16.6, 19.7, 22.8]) wput(quadZ(zt, x, 53.7, x + 2, 55.5), { indigo: .66, blue: .46 });
  wput(quadZ(zt, -26.6, 53.9, -24.4, 55.3), { indigo: .5, blue: .3 });                 // power button
  // combo: cassette flap, disc tray, display window, buttons, jacks
  wput(quadZ(zc, -20.2, 28.3, -2.6, 31.5), { indigo: .64, blue: .42 });
  wput(quadZ(zc, -20.2, 28.3, -2.6, 28.8), { indigo: .8, blue: .56 });
  wput(quadZ(zc, 3.6, 30.1, 19.8, 31.7), { indigo: .7, blue: .46 });
  const win = wput(quadZ(zc, -6.6, 25.0, 7.4, 28.0), { indigo: .93, blue: .8, violet: .32 });
  for (const x of [10.2, 12.4, 14.6, 16.8]) wput(quadZ(zc, x, 25.8, x + 1.3, 26.9), { indigo: .74, blue: .44 });
  for (const [x, c] of [[-19.6, { yellow: .85, indigo: .3 }], [-17.8, { indigo: .2 }], [-16, { pink: .8, indigo: .35 }]]) {
    const p = new Path2D(), [cx, cy] = CAM.project([x, 26.2, zc]), r = Math.max(1.2, 0.42 * CAM.focal / CAM.depth([x, 26.2, zc]));
    p.arc(cx, cy, r, 0, TAU); put(p, c);
  }
  // the clock: green segments, a little glow on the smoked window
  if (vfdOn(t) && win) {
    const g = PG.green, c = CAM.project([1, 26.5, zc]), r = 2.2 * CAM.focal / CAM.depth([1, 26.5, zc]);
    g.save(); g.clip(win);
    const gr = g.createRadialGradient(c[0], c[1], 0, c[0], c[1], r * 3);
    gr.addColorStop(0, 'rgba(0,0,0,.28)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'source-over'; g.fillStyle = gr; g.fillRect(c[0] - r * 3, c[1] - r * 3, r * 6, r * 6);
    g.restore();
    knock(win, { indigo: .35, blue: .35, violet: .35 });
    put(vfdPath(), { green: 1 });
  }
}

/* Irradiance from the logo and the screen's glow at P with normal N: the same
   law renderRoom uses, for vector-drawn things. */
function screenE(P, N) {
  let e = 0;
  const lg = LIGHT.logo;
  if (!lg) return 0;
  for (const [L, I] of [[lg, lg[3]], [[0, 80, 49.5], LIGHT.glow]]) {
    const vx = P[0] - L[0], vy = P[1] - L[1], vz = P[2] - L[2], d2 = vx * vx + vy * vy + vz * vz, d = Math.sqrt(d2);
    const ce = vz / d, cr = -(N[0] * vx + N[1] * vy + N[2] * vz) / d;
    if (ce > 0 && cr > 0) e += I * ce * cr / d2;
  }
  return e;
}

/* ── the duvet over the sleeper's feet ────────────────────────────────────────
   Ridges at fixed depths, farthest first; each is filled down past the frame
   and lit only along its crest, which faces the TV. The crest takes the
   logo's ink, so every bounce recolours them.                               */
const DUVET = (() => {
  const rid = [];
  const bed = (x) => sm((x + 82) / 14) * sm((32 - x) / 14);          // bed width x −82 … 32
  const bump = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
  const prof = [
    { z: 204, f: x => 26 + 32 * bed(x) + 3 * bump(x, -40, 20) + 2 * bump(x, 4, 16) },          // over the foot of the bed
    { z: 220, f: x => 26 + 36 * bed(x) + 8 * bump(x, -38, 15) + 7 * bump(x, -6, 14) },         // the feet
    { z: 246, f: x => 26 + 33 * bed(x) + 6 * bump(x, -30, 22) + 5 * bump(x, 6, 14) },          // shins
  ];
  for (const [k, p] of prof.entries()) {
    const r = rngFor('duvet:' + k), wob = makeWob(r, 3), crest = [];
    for (let x = -130; x <= 80; x += 3) crest.push([x, p.f(x) + 1.2 * wob(x / 210) * bed(x), p.z + 3 * Math.sin(x / 37 + k)]);
    rid.push({ crest, z: p.z });
  }
  return rid;
})();
function drawDuvet() {
  for (const [k, r] of DUVET.entries()) {
    const top = r.crest.map(p => CAM.project(p));
    if (top.some(v => !v)) continue;
    const pts = [...top, [top[top.length - 1][0], 1200], [top[0][0], 1200]];
    const shape = poly(pts);
    const near = k / (DUVET.length - 1);
    put(shape, { indigo: .9 - .04 * near, violet: .62, blue: .3 });
    // the rim: per segment, from the crest's own irradiance (normal up and toward the TV)
    for (let i = 0; i + 1 < r.crest.length; i++) {
      const P = r.crest[i], L = 1 - Math.exp(-0.75 * screenE(P, [0, 0.62, -0.78]));
      if (L < 0.02) continue;
      const seg = line([top[i], top[i + 1]]), w = Math.max(2, 2.2 * CAM.focal / CAM.depth(P));
      for (const [ww, a] of [[w * 2.2, 0.35], [w, 0.75]]) {
        for (const n of ['indigo', 'violet', 'blue']) { const g = PG[n]; g.save(); g.clip(shape); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = a * L * 0.9; g.lineWidth = ww; g.stroke(seg); g.restore(); }
        const g = PG[LIGHT.ink]; g.save(); g.clip(shape); g.globalCompositeOperation = 'source-over'; g.globalAlpha = a * L * 0.85; g.lineWidth = ww; g.stroke(seg); g.restore();
      }
    }
  }
}

/* ── switch-off: the raster collapses to a line, the line to a dot, the dot
   fades (an old set's afterglow). Phases in seconds after T.off.           */
const CRT = { v: 0.09, h: 0.28, fade: 3.4 };
function crtAt(t) {
  const k = t - T.off;
  if (k < 0) return { on: 1 };
  if (k < CRT.v) return { on: 0, ph: 'v', u: k / CRT.v };
  if (k < CRT.h) return { on: 0, ph: 'h', u: (k - CRT.v) / (CRT.h - CRT.v) };
  if (k < CRT.fade) return { on: 0, ph: 'dot', u: (k - CRT.h) / (CRT.fade - CRT.h) };
  return { on: 0, ph: 'dark' };
}
/* Screen-space frame of the picture: centre and px per screen unit. */
function picFrame() {
  const c = CAM.project(picW(PIC.w / 2, PIC.h / 2)), a = CAM.project(picW(PIC.w / 2 + 10, PIC.h / 2)), b = CAM.project(picW(PIC.w / 2, PIC.h / 2 + 10));
  return { c, kx: Math.hypot(a[0] - c[0], a[1] - c[1]) / 10, ky: Math.hypot(b[0] - c[0], b[1] - c[1]) / 10 };
}
function glowOn(n, x, y, rx, ry, a) {
  const g = PG[n];
  g.save(); g.translate(x, y); g.scale(1, ry / rx);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(0.35, 'rgba(0,0,0,' + a * 0.45 + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(-rx, -rx, rx * 2, rx * 2);
  g.restore();
}
function knockGlow(x, y, rx, ry, a) {
  for (const n of ['indigo', 'blue', 'violet']) {
    const g = PG[n];
    g.save(); g.translate(x, y); g.scale(1, ry / rx);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
    gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(0.4, 'rgba(0,0,0,' + a * 0.5 + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(-rx, -rx, rx * 2, rx * 2);
    g.restore();
  }
}
function drawCollapse(st, ink, lx, ly) {
  const F = picFrame(), [cx, cy] = F.c, cov = {};
  if (st.ph === 'v') {
    const s = Math.max(0.012, 1 - st.u), hh = PIC.h / 2 * s, bright = Math.pow(1 - s, 1.4);
    const band = new Path2D();
    band.rect(cx - PIC.w / 2 * F.kx, cy - hh * F.ky, PIC.w * F.kx, 2 * hh * F.ky);
    knock(band, { indigo: .3 + .7 * bright, blue: .3 + .7 * bright, violet: .3 + .7 * bright });
    cov[ink] = 0.25 + 0.5 * bright; add(band, cov);
    // the logo squashed with the raster
    const g = new Path2D(), sq = (polys) => { for (const q of polys) { q.forEach(([a, b], i) => { const x = cx + (lx + a - PIC.w / 2) * F.kx, y = cy + (ly + b - PIC.h / 2) * s * F.ky; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); } };
    sq(LOGO_PATHS.word); sq(LOGO_PATHS.ring);
    const lc = {}; lc[ink] = 1; put(g, lc, 'evenodd');
    knockGlow(cx, cy, PIC.w * 0.6 * F.kx, (hh + 30) * F.ky, bright);
  } else if (st.ph === 'h') {
    const w = PIC.w / 2 * Math.max(0.01, 1 - st.u), ln = new Path2D();
    ln.rect(cx - w * F.kx, cy - 1.6 * F.ky, 2 * w * F.kx, 3.2 * F.ky);
    knockGlow(cx, cy, (w + 40) * F.kx, 26 * F.ky, 1);
    glowOn(ink, cx, cy, (w + 40) * F.kx, 26 * F.ky, 0.7);
    put(ln, {});
  } else if (st.ph === 'dot') {
    const u = st.u, r = 5.5 * Math.pow(1 - u, 0.8), halo = 34 * (1 - u) + 6, a = Math.pow(1 - u, 1.3);
    knockGlow(cx, cy, halo * F.kx, halo * F.ky, Math.min(1, 1.2 * a));
    glowOn(ink, cx, cy, halo * F.kx, halo * F.ky, 0.75 * a);
    if (r > 0.3) { const d = new Path2D(); d.ellipse(cx, cy, r * F.kx, r * F.ky, 0, 0, TAU); put(d, {}); }
  }
}

/* ── the TV's standby light ──────────────────────────────────────────────── */
function drawLED(t) {
  if (t < T.off + 0.35) return;
  const P = [-22, 54.6, TVF[5] + 0.03], q = CAM.project(P), k = CAM.focal / CAM.depth(P);
  const a = sm((t - T.off - 0.35) / 0.25);
  const g = Math.max(9, 3.6 * k);
  knockGlow(q[0], q[1], g, g, 0.7 * a);
  glowOn('pink', q[0], q[1], g, g, 0.55 * a);
  const d = new Path2D(); d.arc(q[0], q[1], Math.max(2.2, 0.42 * k), 0, TAU);
  put(d, { pink: a, orange: a });                                    // pink over orange prints red
}

/* ── glow-in-the-dark stars, stuck on the wall above the TV ──────────────────
   In the screen's light they are pale plastic; in the dark they are the
   brightest things in the room.                                             */
const STARS = (() => {
  const r = rngFor('stars'), out = [];
  const spots = [[58, 212, 7], [96, 190, 5], [128, 226, 8], [150, 176, 4.5], [86, 150, 4], [118, 132, 5.5], [40, 168, 4],
    [-62, 222, 6], [-104, 206, 4.5], [-140, 232, 5], [-20, 236, 4], [10, 196, 5], [-38, 182, 3.6], [164, 210, 5]];
  for (const [x, y, s] of spots) out.push({ x: x + (r() - .5) * 6, y: y + (r() - .5) * 6, s, rot: r() * TAU, kind: 'star' });
  out.push({ x: 104, y: 166, s: 9, rot: -0.5, kind: 'moon' });
  out.push({ x: -100, y: 160, s: 7, rot: 0.3, kind: 'planet' });
  return out;
})();
function starShape(st) {
  const pts = [];
  if (st.kind === 'star') for (let i = 0; i < 10; i++) { const a = st.rot + i * TAU / 10, R = i % 2 ? st.s * 0.42 : st.s; pts.push([st.x + Math.cos(a) * R, st.y + Math.sin(a) * R]); }
  else if (st.kind === 'moon') {
    for (let i = 0; i <= 24; i++) { const a = st.rot + Math.PI * (0.5 + i / 24); pts.push([st.x + Math.cos(a) * st.s, st.y + Math.sin(a) * st.s]); }
    for (let i = 24; i >= 0; i--) { const a = st.rot + Math.PI * (0.5 + i / 24); pts.push([st.x + st.s * 0.42 + Math.cos(a) * st.s * 0.78, st.y + Math.sin(a) * st.s * 0.86]); }
  } else for (let i = 0; i < 28; i++) { const a = i * TAU / 28; pts.push([st.x + Math.cos(a) * st.s * 0.62, st.y + Math.sin(a) * st.s * 0.62]); }
  return pts;
}
function drawStars(t, dark) {
  const z = 0.2;
  for (const st of STARS) {
    const q = CAM.polygon(starShape(st).map(([x, y]) => [x, y, z]));
    if (q.length < 3) continue;
    const p = poly(q);
    if (st.kind === 'planet') {
      const c = Math.cos(st.rot), s = Math.sin(st.rot), ring = [];
      for (let i = 0; i < 28; i++) { const a = i * TAU / 28, dx = Math.cos(a) * st.s * 1.25, dy = Math.sin(a) * st.s * 0.32; ring.push([st.x + dx * c - dy * s, st.y + dx * s + dy * c, z]); }
      const rq = CAM.polygon(ring);
      if (rq.length > 2) p.addPath(poly(rq));
    }
    knock(p, { indigo: .22 + .7 * dark, violet: .22 + .7 * dark, blue: .22 + .7 * dark });
    if (dark > 0.01) {
      const [cx, cy] = CAM.project([st.x, st.y, z]), k = CAM.focal / CAM.depth([st.x, st.y, z]);
      knockGlow(cx, cy, st.s * 2.4 * k, st.s * 2.4 * k, 0.4 * dark);
      glowOn('yellow', cx, cy, st.s * 2.4 * k, st.s * 2.4 * k, 0.22 * dark);
      add(p, { yellow: 0.9 * dark, green: 0.32 * dark });
    }
  }
}

/* ── one car passes in the street below; its lights come up through the
   blinds and sweep the slat stripes across the wall and ceiling.           */
const CAR = { t0: 45.0, t1: 49.6, y: 62, x: -820 };
function carAt(t) {
  if (t <= CAR.t0 || t >= CAR.t1) return null;
  const u = (t - CAR.t0) / (CAR.t1 - CAR.t0), z = lerp(1700, 60, u);
  const I = 1.9 * Math.pow(Math.sin(Math.PI * u), 1.4);
  return [CAR.x, CAR.y, z, I, 7];
}

/* The logo, printed solid in its current ink over the knocked-out glass. */
function drawLogo(t, ink, lx, ly) {
  const cov = {}; cov[ink] = 1;
  put(picPath(LOGO_PATHS.word, lx, ly), cov, 'evenodd');
  put(picPath(LOGO_PATHS.ring, lx, ly), cov, 'evenodd');
}

/* Relative light output per ink: blue and violet read as dim light. */
const INK_LIGHT = { pink: 1.0, yellow: 1.15, green: 0.85, violet: 0.62, orange: 1.0, blue: 0.62 };

function drawArt(t) {
  setCamera(camAt(t));
  const st = crtAt(t), ink = logoInk(t), [lx, ly] = logoXY(t), cu = lx + LOGO.w / 2, cv2 = ly + LOGO.h / 2;
  const L = picW(cu, cv2), fl = t >= T.hit ? 1 + 1.5 * Math.exp(-(t - T.hit) / 0.45) : 1, k = INK_LIGHT[ink] * fl;
  // during the vertical collapse the light dims and gathers to the centre
  const on = st.on ? 1 : st.ph === 'v' ? 1 - st.u : 0;
  const dark = sm((t - T.off - 0.4) / 3.2);
  Object.assign(LIGHT, {
    ink, logo: on ? [lerp(0, L[0], on), lerp(80, L[1], on), L[2] + 0.3, 22000 * k * on] : null, glow: 6000 * on,
    dead: sm((t - T.off - 0.2) / 0.8), lamp: LAMP_I, car: carAt(t), lip: Math.min(2.4, 1.5 * fl), amb: 0.5 * k * on,
    bloom: st.on ? { u: cu, v: cv2, hw: LOGO.w * 0.34, hh: LOGO.h * 0.28, s2: 2 * (46 * fl) ** 2, k: Math.min(1.25, fl) } : null,
  });
  renderRoom();
  drawStars(t, dark);
  drawDetails(t);
  drawLED(t);
  if (st.on) drawLogo(t, ink, lx, ly); else drawCollapse(st, ink, lx, ly);
  drawDuvet();
  compose();
}
/* Passages of the one take, for review; every time comes from T, LEANS, CRT and CAR. */
/* A near miss: two walls touched within half a second before the hit. */
const MISSES = BOUNCES.filter((b, i) => i + 1 < BOUNCES.length && b.t < T.hit && BOUNCES[i + 1].wall !== b.wall && BOUNCES[i + 1].t - b.t < 0.5).map(b => b.t);
const SHOTS = [
  { id: 'bed', start: 0, end: LEANS[0][0], readAt: 3.0, action: 'from the bed: the logo bounces, every wall a new ink; first near miss', transition: 'continuous' },
  { id: 'lean1', start: LEANS[0][0], end: LEANS[1][0], readAt: 12.5, action: 'leans in; second near miss', transition: 'continuous' },
  { id: 'lean2', start: LEANS[1][0], end: LEANS[2][0], readAt: 22.0, action: 'leans in; third near miss', transition: 'continuous' },
  { id: 'close', start: LEANS[2][0], end: T.hit, readAt: 32.0, action: 'the screen fills the frame; the logo heads for the corner', transition: 'continuous' },
  { id: 'hit', start: T.hit, end: T.off, readAt: 36.4, action: 'the corner: pink flare', transition: 'continuous' },
  { id: 'off', start: T.off, end: T.off + CRT.fade, readAt: T.off + 0.6, action: 'sleep timer: raster to a line, a dot, afterglow; standby light', transition: 'continuous' },
  { id: 'dark', start: T.off + CRT.fade, end: DUR, readAt: (CAR.t0 + CAR.t1) / 2, action: 'back to the bed: stars, 12:00, a car sweeps the blinds across the wall', transition: 'end' },
];
/* ── score ────────────────────────────────────────────────────────────────────
   D major with a lydian colour, 96 BPM, bars counted from the first x-wall
   (1.0 s). The logo's two wall rhythms are the two voices. x-walls (every
   5 s, on every other downbeat) play a low FM e-piano on the chord root and
   change the chord; y-walls (every 3.37 s, drifting) play a high FM bell, a
   melody that climbs to D6. A near miss is a y note landing early, an
   anticipation of the next chord: the flam closes 0.35 → 0.23 → 0.12 s, and
   at the corner both land together. The switch-off cuts the music; a music
   box answers under the stars. Every time below comes from BOUNCES, MISSES,
   T, CRT, CAR or SHOTS.                                                     */
const SCORE_MARKS = [...MISSES, T.hit, T.off, (CAR.t0 + CAR.t1) / 2];
const PROG = [            // one chord per x period, from each x-wall
  { root: 'D2', ep: 'D3', pad: ['D3', 'F#3', 'A3', 'C#4'] },        // Dmaj7
  { root: 'D2', ep: 'E3', pad: ['D3', 'E3', 'G#3', 'B3'] },         // E/D, the lydian II
  { root: 'B1', ep: 'B2', pad: ['B2', 'D3', 'F#3', 'C#4'] },        // Bm9
  { root: 'G1', ep: 'G2', pad: ['G2', 'B2', 'F#3', 'C#4'] },        // Gmaj7#11
  { root: 'F#1', ep: 'F#2', pad: ['F#2', 'A2', 'C#3', 'E3'] },      // F#m7
  { root: 'G1', ep: 'G2', pad: ['G2', 'B2', 'D3', 'A3'] },          // Gmaj9
  { root: 'A1', ep: 'A2', pad: ['A2', 'D3', 'E3', 'G3'] },          // A7sus4
  { root: 'D2', ep: 'D3', pad: ['D3', 'F#3', 'A3', 'E4'] },         // D add9: the corner
];
/* The y melody, one note per y-wall in order; near misses take the next chord's note. */
const YMEL = ['A4', 'G#4', 'B4', 'C#5', 'D5', 'F#5', 'E5', 'A5', 'F#5', 'G5', 'D6'];
const XWALLS = BOUNCES.filter(b => b.wall !== 'y'), YWALLS = BOUNCES.filter(b => b.wall !== 'x');
const periodAt = t => clamp(Math.floor((t - XWALLS[0].t + 1e-6) / PX), 0, PROG.length - 1);
/* Where the logo is on screen at t, for pan. */
function logoScreenX(t) {
  const c = Space.camera(camAt(t)), [lx, ly] = logoXY(t), p = c.project(picW(lx + LOGO.w / 2, ly + LOGO.h / 2));
  return p ? p[0] : 540;
}

function roomBed(s) {
  // the set: mains hum and the line-output whine, both gone at the switch-off
  const end = T.off + 0.02;
  for (const [f, lv] of [[60, .0032], [120, .0022], [180, .0012]]) {
    const g = s.ac.createGain(); g.gain.setValueAtTime(TINY, 0); g.gain.linearRampToValueAtTime(lv, 1.2);
    g.gain.setValueAtTime(lv, end - .03); g.gain.linearRampToValueAtTime(TINY, end);
    s.osc('sine', f, 0, end).connect(g); s.place(g, { pan: 0, send: 0, bus: 'bed' });
  }
  const w = s.ac.createGain(); w.gain.setValueAtTime(TINY, 0); w.gain.linearRampToValueAtTime(.0016, 1.5);
  w.gain.setValueAtTime(.0016, end - .02); w.gain.linearRampToValueAtTime(TINY, end);
  s.osc('sine', 15734, 0, end).connect(w); s.place(w, { pan: .05, send: 0, bus: 'bed' });
  air(s, { level: .010, lowpass: 2200, fall: 2.5 });
  air(s, { level: .008, lowpass: 1500, key: 'air2', from: T.off + .1, rise: 2.5, fall: 2.5 });
}

/* Crickets through the closed window: three of them, each with its own pitch,
   chirp rhythm and side; louder once the set is off. */
function crickets(s) {
  const rate = s.rate, n = Math.ceil(rate * s.duration);
  [[4350, -.55, 'a'], [4720, -.25, 'b'], [3980, -.75, 'c']].forEach(([f, pan, k], j) => {
    const b = s.ac.createBuffer(1, n, rate), d = b.getChannelData(0), r = rngFor('standby:cricket:' + k);
    let t = 0.4 + r() * 1.5;
    while (t < s.duration - 0.5) {
      const pulses = 2 + Math.floor(r() * 3), amp = 0.6 + 0.4 * r();
      for (let p = 0; p < pulses; p++) {
        const t0 = t + p * (0.046 + 0.006 * j), i0 = Math.floor(t0 * rate), len = Math.floor(0.021 * rate);
        for (let i = 0; i < len && i0 + i < n; i++) { const u = i / len; d[i0 + i] += amp * Math.sin(Math.PI * u) ** 2 * Math.sin(2 * Math.PI * f * (i / rate)); }
      }
      t += 0.42 + r() * 0.5 + (r() < 0.12 ? 1.4 * r() : 0);
    }
    const lp = s.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    const g = s.ac.createGain(), lv = .0045;
    g.gain.setValueAtTime(TINY, 0); g.gain.linearRampToValueAtTime(lv, 2);
    g.gain.setValueAtTime(lv, T.off + .2); g.gain.linearRampToValueAtTime(lv * 2.6, T.off + 3);
    g.gain.setValueAtTime(lv * 2.6, s.duration - 2.2); g.gain.linearRampToValueAtTime(TINY, s.duration);
    s.play(b, 0, s.duration).connect(lp).connect(g); s.place(g, { pan, send: .25, bus: 'bed' });
  });
}

/* Pads, one chord per x period; cut with the picture at the switch-off. */
function pads(s) {
  XWALLS.forEach((b, i) => {
    const c = PROG[Math.min(i, PROG.length - 1)], end = i + 1 < XWALLS.length ? XWALLS[i + 1].t + 0.6 : T.off + 0.12;
    const hit = b.t >= T.hit;
    pad(s, b.t - (i === 0 ? 0.9 : 0.25), end, c.pad.map(note), { level: hit ? .024 : .0075 + .003 * i, attack: i === 0 ? 1.6 : .5, release: hit ? .1 : .7, cutoff: 700 + 90 * i, open: 500, send: .55 });
  });
}

/* The two wall voices. */
function bounceVoices(s) {
  XWALLS.forEach((b, i) => {
    const c = PROG[Math.min(i, PROG.length - 1)], x = logoScreenX(b.t), hit = b.t >= T.hit;
    fm(s, b.t + (hit ? .02 : 0), note(c.ep), { level: hit ? .028 : .034, attack: .008, index: 3.2, indexEnd: .5, indexDecay: .35, release: 2.4, x, send: .45 });
    sub(s, b.t, note(c.root) + 12, { level: hit ? 0 : .016, release: 1.6, drop: 5 });
  });
  YWALLS.forEach((b, i) => {
    if (b.t >= T.off) return;
    const m = note(YMEL[Math.min(i, YMEL.length - 1)]), x = logoScreenX(b.t), hit = Math.abs(b.t - T.hit) < 1e-6;
    const miss = MISSES.some(t => Math.abs(t - b.t) < 1e-6);
    fm(s, b.t, m, { level: hit ? .05 : miss ? .066 : .056, attack: hit ? .012 : .006, ratio: 3.5, index: 2.2, indexEnd: .25, indexDecay: .5, release: hit ? 3 : 2, x, send: .55 });
    if (miss || hit) glass(s, b.t + (hit ? .035 : 0), m + 12, { level: hit ? .01 : .018, decay: 1.4, x, send: .6 });
  });
}

/* The last approach: a soft eighth-note pulse on the chord tones, growing to the corner. */
function approachPulse(s) {
  const e = 60 / 96 / 2, t0 = MISSES[2] + 0.3;
  for (let t = XWALLS[0].t + Math.ceil((t0 - XWALLS[0].t) / e) * e, k = 0; t < T.hit - 0.01; t += e, k++) {
    const c = PROG[periodAt(t)], tones = c.pad.map(note), u = (t - t0) / (T.hit - t0);
    musicBox(s, t, tones[(k * 2 + (k >> 2)) % tones.length] + 12, { level: .01 + .026 * u * u, decay: .35, pan: (k % 2 ? .25 : -.25), send: .35 });
  }
  riser(s, T.hit, 3.2, { level: .012, from: 147, to: 587, type: 'triangle', send: .5 });
}

/* The corner: low body, a staggered bell chord, then sparkles falling while the room is pink. */
function corner(s) {
  sub(s, T.hit, note('D1') + 12, { level: .026, attack: .14, release: 3, drop: 7 });
  ['D5', 'F#5', 'A5', 'E6'].forEach((n, i) => bell(s, T.hit + .16 + i * .09, note(n), { level: .01 - i * .0015, decay: 3.2, pan: -.3 + i * .2, send: .6 }));
  const fall = ['A6', 'F#6', 'E6', 'D6', 'A5', 'F#5', 'E5', 'D5'];
  fall.forEach((n, i) => musicBox(s, T.hit + 0.62 + i * 0.3125, note(n), { level: .014 * (1 - i * .07), decay: .5, pan: .4 - i * .1, send: .5 }));
}

/* Switch-off: relay click, the high voltage letting go, static crackle on the glass. */
function switchOff(s) {
  contact(s, T.off, { material: 'card', f0: 900, level: .018, pan: 0, send: .2, key: 'relay' });
  const g = s.ac.createGain(), stop = s.env(g.gain, T.off, { attack: .012, release: .35, peak: .03 });
  const o = s.osc('sine', 110, T.off, stop); o.frequency.exponentialRampToValueAtTime(38, T.off + .3); o.connect(g); s.place(g, { pan: 0, send: .2, bus: 'fx' });
  breath(s, T.off - .02, .32, { level: .02, from: 5200, to: 900, send: .3 });
  const r = rngFor('standby:crackle');
  for (let k = 0; k < 26; k++) {
    const t = T.off + .12 + Math.pow(r(), 1.8) * 2.6;
    tickFx(s, t, { level: .012 * (1 - (t - T.off) / 3), freq: 2400 + 3000 * r(), decay: .006, pan: (r() - .5) * .5, send: .2 });
  }
}

/* Under the stars: the y melody's first notes on a music box, slow, ending home. */
function lullaby(s) {
  const t0 = T.off + 2.1, step = 1.25;
  const tune = [['A4', 0], ['G#4', 1], ['B4', 2], ['C#5', 3], ['D5', 6.6]];
  tune.forEach(([n, k], i) => musicBox(s, t0 + k * step, note(n), { attack: .005, level: i === tune.length - 1 ? .034 : .028, decay: i === tune.length - 1 ? 2.6 : 1.3, pan: .15, send: .6 }));
  pad(s, T.off + 1.0, s.duration, ['D3', 'A3', 'E4'].map(note), { level: .0055, attack: 2.4, release: 2.6, cutoff: 520, open: 260, send: .6 });
}

/* One car in the street to the left: tyres, engine, a doppler sweep. */
function carPass(s) {
  const { t0, t1 } = CAR, mid = (t0 + t1) / 2, dur = t1 - t0;
  const n = s.play(s.noise('standby:car', dur + .2, 'pink'), t0, t1);
  const bp = s.ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .7;
  bp.frequency.setValueAtTime(380, t0); bp.frequency.exponentialRampToValueAtTime(820, mid); bp.frequency.exponentialRampToValueAtTime(260, t1);
  const lp = s.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const g = s.ac.createGain(); s.swell(g.gain, t0, dur, .05, .52);
  n.connect(bp).connect(lp).connect(g);
  const p = s.place(g, { pan: -.55, send: .3, bus: 'fx' });
  p.pan.setValueAtTime(-.3, t0); p.pan.linearRampToValueAtTime(-.75, t1);
  const eg = s.ac.createGain(); s.swell(eg.gain, t0, dur, .02, .5);
  const eo = s.osc('triangle', 52, t0, t1); eo.frequency.setValueAtTime(58, t0); eo.frequency.exponentialRampToValueAtTime(44, t1);
  const ef = s.ac.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 160;
  eo.connect(ef).connect(eg); s.place(eg, { pan: -.4, send: .1, bus: 'fx' });
}

let scoreBuffer = null, scorePromise = null;
async function buildScore() {
  const s = Score({ duration: DUR, key: 'standby', room: { seconds: 2.0, decay: .6, wet: .2 } });
  roomBed(s); crickets(s); pads(s); bounceVoices(s); approachPulse(s); corner(s); switchOff(s); lullaby(s); carPass(s);
  const buf = await s.render({ target: -16, ceiling: -1 });
  buildScore.stats = s.stats;
  return buf;
}
function ensureScore() { return scoreBuffer ? Promise.resolve(scoreBuffer) : (scorePromise ??= buildScore().then(b => scoreBuffer = b)); }
async function renderAudio() { return wavBase64(await ensureScore()); }
// ART END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=canvas.height=OUT;
paper=bakePaper();
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time');
function render(t) {
  t=clamp(t,0,DUR); ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paper,0,0);drawArt(t);scrub.value=t;clockLabel.value=t.toFixed(2);
}
function paintBaked(id) {
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(bakeScene(id,OUT),0,0);ctx.restore();
}
/* A frame slower than the frame interval cannot play live (live-plate films take
   100-200 ms): Play then renders every frame once into a WebP cache, shown as
   "Buffering n%", and plays from it at FPS; replays are immediate. Fast films play
   live. seek() and window.__riso stay live and pure; tools never touch the cache. */
const FPS=30,NF=Math.round(DUR*FPS),cache=[],bitmaps=new Map(),playBtn=document.getElementById('play');
let at=0,playing=false,epoch=0,recorder=null,recordURL=null,slow=null,buffering=false,filled=0;
function label(){playBtn.textContent=playing?'Pause':buffering?'Buffering '+Math.round(filled/(NF+1)*100)+'%':'Play';}
function start(){if(at>=DUR)at=0;epoch=performance.now()-at*1000;playing=true;label();syncAudio();}
function pause(){if(playing)at=clamp((performance.now()-epoch)/1000,0,DUR);playing=false;buffering=false;label();syncAudio();if(recorder?.state==='recording')recorder.stop();}
async function buffer(){
  buffering=true;label();const resume=at;
  for(let i=0;i<=NF&&buffering;i++){
    if(cache[i])continue;
    render(i/FPS);canvas.toBlob(b=>{cache[i]=b;filled++;},'image/webp',0.8);   // snapshots now, encodes alongside the next draw
    label();await new Promise(r=>setTimeout(r,0));
  }
  while(buffering&&filled<NF+1)await new Promise(r=>setTimeout(r,50));
  if(buffering){buffering=false;at=resume;start();}
}
function play(){
  if(at>=DUR)at=0;
  if(slow===null){const t0=performance.now();render(at);render(at);slow=(performance.now()-t0)/2>900/FPS;}
  if(!slow||filled>=NF+1)start();else buffer();
}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
playBtn.onclick=()=>playing||buffering?pause():play();
document.getElementById('replay').onclick=()=>{seek(0);play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing||buffering?pause():play();if(e.code==='ArrowLeft')seek(at-1/FPS);if(e.code==='ArrowRight')seek(at+1/FPS);});
document.getElementById('record').onclick=()=>{
  if(recorder?.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(FPS),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.getElementById('download');a.href=recordURL;a.download='preview.webm';a.style.display='inline';};
  recorder.start();play();
};
function tick(now){
  if(playing){
    at=clamp((now-epoch)/1000,0,DUR);
    if(!slow)render(at);
    else{
      const i=Math.min(NF,Math.floor(at*FPS));
      for(let j=i;j<Math.min(NF+1,i+8);j++)if(cache[j]&&!bitmaps.has(j)){bitmaps.set(j,null);createImageBitmap(cache[j]).then(b=>bitmaps.set(j,b));}
      for(const [j,b] of bitmaps)if(j<i-1){if(b)b.close();bitmaps.delete(j);}
      const b=bitmaps.get(i);
      if(b){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);scrub.value=at;clockLabel.value=at.toFixed(2);}
    }
    if(at>=DUR)pause();
  }
  requestAnimationFrame(tick);
}
/* In-page sound: the cached score buffer, started from the playhead, stopped on pause
   and seek. Off until asked for; the export never plays in the page. */
let liveCtx=null,liveSrc=null,audioOn=false;
function syncAudio(){
  if(liveSrc){liveSrc.onended=null;try{liveSrc.stop();}catch(e){/* already ended */}liveSrc=null;}
  if(!audioOn||!playing||!scoreBuffer||at>=DUR)return;
  const src=liveCtx.createBufferSource();src.buffer=scoreBuffer;src.connect(liveCtx.destination);src.start(0,at);
  src.onended=()=>{if(liveSrc===src)liveSrc=null;};liveSrc=src;
}
document.getElementById('audio').onclick=async function(){
  audioOn=!audioOn;
  if(!audioOn){this.textContent='Audio: off';syncAudio();return;}
  this.textContent='Audio: rendering';liveCtx=liveCtx||new AudioContext();await liveCtx.resume();await ensureScore();
  this.textContent=audioOn?'Audio: on':'Audio: off';syncAudio();
};
window.__riso={duration:DUR,ready:false,seek,shots:SHOTS,renderAudio,marks:SCORE_MARKS};
for(const id of Object.keys(SCENES))bakeScene(id,OUT);
seek(Number(new URLSearchParams(location.search).get('t'))||0);
requestAnimationFrame(tick);
window.__riso.ready=true;
</script></html>
